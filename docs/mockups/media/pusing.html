<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ekspresi Pusing</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    }
    body {
      background-color: #ffffff;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }
    .container {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }
    .title {
      font-size: 20px;
      font-weight: 700;
      color: #0F172A;
      letter-spacing: -0.3px;
      margin-bottom: 18px;
    }
    .mascot-svg {
      display: inline-flex;
      line-height: 0;
      width: 240px;
      height: 150px;
      overflow: visible;
    }

    /* ==========================================================
       SISTEM RIGGING SMOOTH 3 DETIK (MULTI-PART NATURAL MOTION)
       ========================================================== */
    .rig-torso {
      transform-box: view-box;
      transform-origin: 120px 132px;
      animation: torsoAnim 3s cubic-bezier(0.45, 0.05, 0.55, 0.95) infinite;
    }
    .rig-leg-l {
      transform-box: view-box;
      transform-origin: 93px 130px;
      animation: legLAnim 3s cubic-bezier(0.45, 0.05, 0.55, 0.95) infinite;
    }
    .rig-leg-r {
      transform-box: view-box;
      transform-origin: 147px 130px;
      animation: legRAnim 3s cubic-bezier(0.45, 0.05, 0.55, 0.95) infinite;
    }
    .rig-antenna-l {
      transform-box: view-box;
      transform-origin: 83px 53px;
      animation: antLAnim 3s cubic-bezier(0.45, 0.05, 0.55, 0.95) infinite;
    }
    .rig-antenna-r {
      transform-box: view-box;
      transform-origin: 157px 53px;
      animation: antRAnim 3s cubic-bezier(0.45, 0.05, 0.55, 0.95) infinite;
    }
    .rig-brows {
      transform-box: fill-box;
      transform-origin: center center;
      animation: browAnim 3s cubic-bezier(0.45, 0.05, 0.55, 0.95) infinite;
    }
    .rig-eyes {
      transform-box: fill-box;
      transform-origin: center center;
      animation: eyesAnim 3s cubic-bezier(0.45, 0.05, 0.55, 0.95) infinite;
    }
    .rig-glasses {
      transform-box: fill-box;
      transform-origin: center center;
      animation: glassesAnim 3s cubic-bezier(0.45, 0.05, 0.55, 0.95) infinite;
    }
    .rig-mouth {
      transform-box: fill-box;
      transform-origin: center center;
      animation: mouthAnim 3s cubic-bezier(0.45, 0.05, 0.55, 0.95) infinite;
    }
    .rig-arm-l {
      transform-box: view-box;
      transform-origin: 39px 103px;
      animation: armLAnim 3s cubic-bezier(0.45, 0.05, 0.55, 0.95) infinite;
    }
    .rig-arm-r {
      transform-box: view-box;
      transform-origin: 201px 102px;
      animation: armRAnim 3s cubic-bezier(0.45, 0.05, 0.55, 0.95) infinite;
    }
    .rig-prop {
      transform-box: fill-box;
      transform-origin: center center;
      animation: propAnim 3s cubic-bezier(0.45, 0.05, 0.55, 0.95) infinite;
    }

    /* Sinkronisasi Bayangan & LED selama 3 Detik */
    @keyframes shadowSync {
      0%, 100% { transform: scale(1); opacity: 0.8; }
      50% { transform: scale(0.88); opacity: 0.48; }
    }
    .led-1 { animation: ledPulse 3s ease-in-out infinite 0s; }
    .led-2 { animation: ledPulse 3s ease-in-out infinite 0.4s; }
    .led-3 { animation: ledPulse 3s ease-in-out infinite 0.8s; }
    @keyframes ledPulse {
      0%, 100% { fill: #0F172A; }
      50% { fill: #F59E0B; }
    }

    /* Default fallback jika bagian opsional kosong */
    @keyframes browAnim { 0%, 100% { transform: none; } }
    @keyframes glassesAnim { 0%, 100% { transform: none; } }
    @keyframes propAnim { 0%, 100% { transform: none; } }

    /* Keyframes Spesifik Karakter (Siklus 3 Detik Smooth) */
    
      @keyframes torsoAnim {
        0%, 100% { transform: translate(0px, 0px) rotate(0deg); }
        25% { transform: translate(-4px, 2px) rotate(-3.5deg); }
        50% { transform: translate(0px, 4px) rotate(0deg); }
        75% { transform: translate(4px, 2px) rotate(3.5deg); }
      }
      @keyframes legLAnim {
        0%, 100% { transform: rotate(0deg); }
        25% { transform: rotate(8deg) translateY(-2px); }
        50% { transform: rotate(-3deg); }
        75% { transform: rotate(-8deg) translateY(-1px); }
      }
      @keyframes legRAnim {
        0%, 100% { transform: rotate(0deg); }
        25% { transform: rotate(8deg) translateY(-1px); }
        50% { transform: rotate(3deg); }
        75% { transform: rotate(-8deg) translateY(-2px); }
      }
      @keyframes antLAnim {
        0%, 100% { transform: rotate(0deg); }
        25% { transform: rotate(-14deg); }
        50% { transform: rotate(6deg); }
        75% { transform: rotate(-10deg); }
      }
      @keyframes antRAnim {
        0%, 100% { transform: rotate(0deg); }
        25% { transform: rotate(10deg); }
        50% { transform: rotate(-6deg); }
        75% { transform: rotate(14deg); }
      }
      @keyframes eyesAnim {
        0%, 100% { transform: translate(0px, -2.5px) scale(1, 1); }
        25% { transform: translate(2.5px, 0px) scale(1.06, 0.94); }
        50% { transform: translate(0px, 2.5px) scale(0.94, 1.06); }
        75% { transform: translate(-2.5px, 0px) scale(1.06, 0.94); }
      }
      @keyframes mouthAnim {
        0%, 100% { transform: translate(0px, 0px) scale(1, 1); }
        25% { transform: translate(-2px, 1px) scale(1.08, 0.85); }
        50% { transform: translate(0px, 2px) scale(0.92, 1.2); }
        75% { transform: translate(2px, 1px) scale(1.08, 0.85); }
      }
      @keyframes armLAnim {
        0%, 100% { transform: rotate(0deg); }
        25% { transform: rotate(6deg) translateY(1px); }
        50% { transform: rotate(-4deg); }
        75% { transform: rotate(5deg) translateY(1px); }
      }
      @keyframes armRAnim {
        0%, 100% { transform: rotate(0deg); }
        25% { transform: rotate(-5deg) translateY(1px); }
        50% { transform: rotate(4deg); }
        75% { transform: rotate(-6deg) translateY(1px); }
      }
      .rig-prop {
        transform-box: view-box;
        transform-origin: 121.5px 43px;
        animation: propAnim 3s linear infinite;
      }
      .rig-prop path {
        transform-box: fill-box;
        transform-origin: center center;
        animation: starSelfSpin 3s linear infinite;
      }
      @keyframes propAnim {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
      }
      @keyframes starSelfSpin {
        0% { transform: rotate(0deg) scale(1); }
        50% { transform: rotate(-180deg) scale(1.12); }
        100% { transform: rotate(-360deg) scale(1); }
      }
    
  </style>
</head>
<body>

        <!-- Kacamata / Visor (Tidak ikut terpejam saat mata berkedip) -->

    </svg>
  </div>
</body>
</html>
