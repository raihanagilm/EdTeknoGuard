<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mendeteksi Gangguan</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    }
    body {
      background-color: #ffffff;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }
    .container {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }
    .title {
      font-size: 20px;
      font-weight: 700;
      color: #0F172A;
      letter-spacing: -0.3px;
      margin-bottom: 18px;
    }
    .mascot-svg {
      display: inline-flex;
      line-height: 0;
      width: 240px;
      height: 150px;
      overflow: visible;
    }

    /* ==========================================================
       SISTEM RIGGING SMOOTH 3 DETIK (MULTI-PART NATURAL MOTION)
       ========================================================== */
    .rig-torso {
      transform-box: view-box;
      transform-origin: 120px 132px;
      animation: torsoAnim 3s cubic-bezier(0.45, 0.05, 0.55, 0.95) infinite;
    }
    .rig-leg-l {
      transform-box: view-box;
      transform-origin: 93px 130px;
      animation: legLAnim 3s cubic-bezier(0.45, 0.05, 0.55, 0.95) infinite;
    }
    .rig-leg-r {
      transform-box: view-box;
      transform-origin: 147px 130px;
      animation: legRAnim 3s cubic-bezier(0.45, 0.05, 0.55, 0.95) infinite;
    }
    .rig-antenna-l {
      transform-box: view-box;
      transform-origin: 83px 53px;
      animation: antLAnim 3s cubic-bezier(0.45, 0.05, 0.55, 0.95) infinite;
    }
    .rig-antenna-r {
      transform-box: view-box;
      transform-origin: 157px 53px;
      animation: antRAnim 3s cubic-bezier(0.45, 0.05, 0.55, 0.95) infinite;
    }
    .rig-brows {
      transform-box: fill-box;
      transform-origin: center center;
      animation: browAnim 3s cubic-bezier(0.45, 0.05, 0.55, 0.95) infinite;
    }
    .rig-eyes {
      transform-box: fill-box;
      transform-origin: center center;
      animation: eyesAnim 3s cubic-bezier(0.45, 0.05, 0.55, 0.95) infinite;
    }
    .rig-glasses {
      transform-box: fill-box;
      transform-origin: center center;
      animation: glassesAnim 3s cubic-bezier(0.45, 0.05, 0.55, 0.95) infinite;
    }
    .rig-mouth {
      transform-box: fill-box;
      transform-origin: center center;
      animation: mouthAnim 3s cubic-bezier(0.45, 0.05, 0.55, 0.95) infinite;
    }
    .rig-arm-l {
      transform-box: view-box;
      transform-origin: 50px 99px;
      animation: armLAnim 3s cubic-bezier(0.45, 0.05, 0.55, 0.95) infinite;
    }
    .rig-arm-r {
      transform-box: view-box;
      transform-origin: 194px 98px;
      animation: armRAnim 3s cubic-bezier(0.45, 0.05, 0.55, 0.95) infinite;
    }
    .rig-prop {
      transform-box: fill-box;
      transform-origin: center center;
      animation: propAnim 3s cubic-bezier(0.45, 0.05, 0.55, 0.95) infinite;
    }

    /* Sinkronisasi Bayangan & LED selama 3 Detik */
    @keyframes shadowSync {
      0%, 100% { transform: scale(1); opacity: 0.8; }
      50% { transform: scale(0.88); opacity: 0.48; }
    }
    .led-1 { animation: ledPulse 3s ease-in-out infinite 0s; }
    .led-2 { animation: ledPulse 3s ease-in-out infinite 0.4s; }
    .led-3 { animation: ledPulse 3s ease-in-out infinite 0.8s; }
    @keyframes ledPulse {
      0%, 100% { fill: #0F172A; }
      50% { fill: #EF4444; }
    }

    /* Default fallback jika bagian opsional kosong */
    @keyframes browAnim { 0%, 100% { transform: none; } }
    @keyframes glassesAnim { 0%, 100% { transform: none; } }
    @keyframes propAnim { 0%, 100% { transform: none; } }

    /* Keyframes Spesifik Karakter (Siklus 3 Detik Smooth) */
    
      @keyframes torsoAnim {
        0%, 100% { transform: translateY(0px) rotate(0deg); }
        25% { transform: translateY(-6px) rotate(-2deg); }
        50% { transform: translateY(-2px) rotate(2deg); }
        75% { transform: translateY(-5px) rotate(-1.5deg); }
      }
      @keyframes legLAnim {
        0%, 100% { transform: rotate(0deg); }
        25% { transform: rotate(-8deg) translateY(-2px); }
        50% { transform: rotate(6deg); }
        75% { transform: rotate(-7deg) translateY(-2px); }
      }
      @keyframes legRAnim {
        0%, 100% { transform: rotate(0deg); }
        25% { transform: rotate(-6deg); }
        50% { transform: rotate(8deg) translateY(-2px); }
        75% { transform: rotate(-5deg); }
      }
      @keyframes antLAnim {
        0%, 100% { transform: rotate(0deg); }
        25% { transform: rotate(-12deg); }
        50% { transform: rotate(6deg); }
        75% { transform: rotate(-10deg); }
      }
      @keyframes antRAnim {
        0%, 100% { transform: rotate(0deg); }
        25% { transform: rotate(12deg); }
        50% { transform: rotate(-6deg); }
        75% { transform: rotate(10deg); }
      }
      @keyframes eyesAnim {
        0%, 44%, 52%, 100% { transform: translate(0px, 0px) scale(1); }
        25% { transform: translate(3px, -1px) scale(1.08); }
        48% { transform: translate(2px, 0px) scale(1, 0.1); }
        75% { transform: translate(3px, 1px) scale(1.06); }
      }
      @keyframes mouthAnim {
        0%, 100% { transform: scale(1, 1); }
        25% { transform: scale(1.2, 1.35); }
        50% { transform: scale(0.9, 0.85); }
        75% { transform: scale(1.15, 1.25); }
      }
      @keyframes armRAnim {
        0%, 100% { transform: rotate(0deg); }
        35% { transform: rotate(-8deg); }
        70% { transform: rotate(4deg); }
      }
      @keyframes armLAnim {
        0%, 100% { transform: rotate(0deg); }
        50% { transform: rotate(-8deg); }
      }
      @keyframes propAnim {
        0%, 100% { transform: translateY(0px) scale(1); }
        50% { transform: translateY(-6px) scale(1.12); }
      }
    
  </style>
</head>
<body>
  <div class="container">
    <h1 class="title">Mendeteksi Gangguan</h1>
    <svg class="mascot-svg" viewBox="0 10 240 150" fill="none" xmlns="http://www.w3.org/2000/svg">
      <!-- Badan Utama & Seluruh Anggota Tubuh Menyatu (Torso Rig) -->
      <g class="rig-torso">
        <!-- Kaki Kiri & Kaki Kanan (Menyatu di belakang bodi agar tidak pernah copot & ikut bergerak) -->
        <g class="rig-leg-l">
          <path d="M85 118V154H101V118" fill="#20C5D2"/>
          <path d="M85 118V154H101V118" stroke="#0F172A" stroke-width="4" stroke-linejoin="round"/>
        </g>
        <g class="rig-leg-r">
          <path d="M139 118V154H155V118" fill="#20C5D2"/>
          <path d="M139 118V154H155V118" stroke="#0F172A" stroke-width="4" stroke-linejoin="round"/>
        </g>

        <!-- Antena Kiri & Kanan -->
        <g class="rig-antenna-l">
          <path d="M78 53.9999L68 17.9999C67 13.9999 73 12.9999 76 15.9999L88 51.9999L78 53.9999Z" fill="#2563EB" stroke="#0F172A" stroke-width="5" stroke-linejoin="round"/>
        </g>
        <g class="rig-antenna-r">
          <path d="M162 53.9999L172 17.9999C173 13.9999 167 12.9999 164 15.9999L152 51.9999L162 53.9999Z" fill="#2563EB" stroke="#0F172A" stroke-width="5" stroke-linejoin="round"/>

        <!-- Bodi Router -->

          <path d="M44 114C70 118 170 118 196 114" stroke="#0F172A" stroke-width="3.5" stroke-linecap="round"/>
          <path d="M120 125.5C121.933 125.5 123.5 123.933 123.5 122C123.5 120.067 121.933 118.5 120 118.5C118.067 118.5 116.5 120.067 116.5 122C116.5 123.933 118.067 125.5 120 125.5Z" stroke="#0F172A" stroke-width="1.8"/>

        </g>

        <!-- Lampu Indikator LED -->
        <g class="rig-leds">
          
          <path class="led-1" d="M64 124.5C65.3807 124.5 66.5 123.381 66.5 122C66.5 120.619 65.3807 119.5 64 119.5C62.6193 119.5 61.5 120.619 61.5 122C61.5 123.381 62.6193 124.5 64 124.5Z" fill="#0F172A"/>
          <path class="led-2" d="M72 124.5C73.3807 124.5 74.5 123.381 74.5 122C74.5 120.619 73.3807 119.5 72 119.5C70.6193 119.5 69.5 120.619 69.5 122C69.5 123.381 70.6193 124.5 72 124.5Z" fill="#0F172A"/>
          <path class="led-3" d="M80 124.5C81.3807 124.5 82.5 123.381 82.5 122C82.5 120.619 81.3807 119.5 80 119.5C78.6193 119.5 77.5 120.619 77.5 122C77.5 123.381 78.6193 124.5 80 124.5Z" fill="#0F172A"/>
        </g>

        <!-- Alis (Jika ada) -->
        <g class="rig-brows">
          
        </g>

        <!-- Bola Mata (Berkedip & Melirik) -->
        <g class="rig-eyes">
          <path d="M92 92.5C97.799 92.5 102.5 87.799 102.5 82C102.5 76.201 97.799 71.5 92 71.5C86.201 71.5 81.5 76.201 81.5 82C81.5 87.799 86.201 92.5 92 92.5Z" fill="#0F172A"/>
          <path d="M94 83.5C95.933 83.5 97.5 81.933 97.5 80C97.5 78.067 95.933 76.5 94 76.5C92.067 76.5 90.5 78.067 90.5 80C90.5 81.933 92.067 83.5 94 83.5Z" fill="white"/>
          <path d="M148 92.5C153.799 92.5 158.5 87.799 158.5 82C158.5 76.201 153.799 71.5 148 71.5C142.201 71.5 137.5 76.201 137.5 82C137.5 87.799 142.201 92.5 148 92.5Z" fill="#0F172A"/>
          <path d="M150 83.5C151.933 83.5 153.5 81.933 153.5 80C153.5 78.067 151.933 76.5 150 76.5C148.067 76.5 146.5 78.067 146.5 80C146.5 81.933 148.067 83.5 150 83.5Z" fill="white"/>
        </g>

        <!-- Kacamata / Visor (Tidak ikut terpejam saat mata berkedip) -->
        <g class="rig-glasses">
          
        </g>

        <!-- Mulut -->
        <g class="rig-mouth">
          <path d="M120 106C123.314 106 126 102.418 126 98C126 93.5817 123.314 90 120 90C116.686 90 114 93.5817 114 98C114 102.418 116.686 106 120 106Z" fill="#0F172A" stroke="#0F172A" stroke-width="2"/>
        </g>

        <!-- Objek Meja / Monitor / Laptop (Di belakang tangan) -->
        <g class="rig-desk-prop">
          
        </g>

        <!-- Tangan Kiri -->
        <g class="rig-arm-l">
          <path d="M50 99C50 119 74 125 92 123" stroke="#0F172A" stroke-width="4.5" stroke-linecap="round"/>
          <path d="M92 129C95.3137 129 98 126.314 98 123C98 119.686 95.3137 117 92 117C88.6863 117 86 119.686 86 123C86 126.314 88.6863 129 92 129Z" fill="#20C5D2" stroke="#0F172A" stroke-width="3.5"/>
        </g>

        <!-- Tangan Kanan -->
        <g class="rig-arm-r">
          <path d="M173.605 94.6946L151.939 98.5149C149.764 98.8985 148.311 100.973 148.695 103.149L154.599 136.632C154.982 138.808 157.057 140.26 159.232 139.877L180.898 136.057C183.074 135.673 184.526 133.598 184.143 131.423L178.239 97.9393C177.855 95.7637 175.781 94.311 173.605 94.6946Z" fill="#64748B" stroke="#0F172A" stroke-width="3"/>
          <path d="M173.141 97.8227L153.445 101.296C152.357 101.487 151.631 102.525 151.823 103.613L157.032 133.157C157.224 134.245 158.261 134.971 159.349 134.779L179.045 131.306C180.133 131.114 180.859 130.077 180.667 128.989L175.458 99.445C175.266 98.3572 174.229 97.6309 173.141 97.8227Z" fill="#F8FAFC"/>
          <path d="M158 115.209L164 114.209" stroke="#EF4444" stroke-width="3" stroke-linecap="round"/>
          <path d="M194.355 98C200.028 105.934 186.03 119.54 173.688 127.165" stroke="#0F172A" stroke-width="4.5" stroke-linecap="round"/>
          <path d="M177.069 131.894C174.374 133.822 170.626 133.199 168.699 130.503C166.772 127.808 167.394 124.06 170.09 122.133C172.785 120.205 176.533 120.828 178.46 123.524C180.388 126.219 179.765 129.967 177.069 131.894Z" fill="#20C5D2" stroke="#0F172A" stroke-width="3.5"/>
        </g>

        <!-- Properti & Efek Pendukung -->
        <g class="rig-prop">
          <path d="M196 44L218 80H174L196 44Z" fill="#EF4444" stroke="#0F172A" stroke-width="3.5" stroke-linejoin="round"/>
          <path d="M196 54V67" stroke="white" stroke-width="4" stroke-linecap="round"/>
          <path d="M196 75.5C197.381 75.5 198.5 74.3807 198.5 73C198.5 71.6193 197.381 70.5 196 70.5C194.619 70.5 193.5 71.6193 193.5 73C193.5 74.3807 194.619 75.5 196 75.5Z" fill="white"/>
        </g>
      </g>
    </svg>
  </div>
</body>
</html>
