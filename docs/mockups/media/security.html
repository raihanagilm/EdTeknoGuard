<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Peran Cyber Security</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    }
    body {
      background-color: #ffffff;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }
    .container {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }
    .title {
      font-size: 20px;
      font-weight: 700;
      color: #0F172A;
      letter-spacing: -0.3px;
      margin-bottom: 18px;
    }
    .mascot-svg {
      display: inline-flex;
      line-height: 0;
      width: 240px;
      height: 150px;
      overflow: visible;
    }

    /* ==========================================================
       SISTEM RIGGING SMOOTH 3 DETIK (MULTI-PART NATURAL MOTION)
       ========================================================== */
    .rig-torso {
      transform-box: view-box;
      transform-origin: 120px 132px;
      animation: torsoAnim 3s cubic-bezier(0.45, 0.05, 0.55, 0.95) infinite;
    }
    .rig-leg-l {
      transform-box: view-box;
      transform-origin: 93px 130px;
      animation: legLAnim 3s cubic-bezier(0.45, 0.05, 0.55, 0.95) infinite;
    }
    .rig-leg-r {
      transform-box: view-box;
      transform-origin: 147px 130px;
      animation: legRAnim 3s cubic-bezier(0.45, 0.05, 0.55, 0.95) infinite;
    }
    .rig-antenna-l {
      transform-box: view-box;
      transform-origin: 83px 53px;
      animation: antLAnim 3s cubic-bezier(0.45, 0.05, 0.55, 0.95) infinite;
    }
    .rig-antenna-r {
      transform-box: view-box;
      transform-origin: 157px 53px;
      animation: antRAnim 3s cubic-bezier(0.45, 0.05, 0.55, 0.95) infinite;
    }
    .rig-brows {
      transform-box: fill-box;
      transform-origin: center center;
      animation: browAnim 3s cubic-bezier(0.45, 0.05, 0.55, 0.95) infinite;
    }
    .rig-eyes {
      transform-box: fill-box;
      transform-origin: center center;
      animation: eyesAnim 3s cubic-bezier(0.45, 0.05, 0.55, 0.95) infinite;
    }
    .rig-glasses {
      transform-box: fill-box;
      transform-origin: center center;
      animation: glassesAnim 3s cubic-bezier(0.45, 0.05, 0.55, 0.95) infinite;
    }
    .rig-mouth {
      transform-box: fill-box;
      transform-origin: center center;
      animation: mouthAnim 3s cubic-bezier(0.45, 0.05, 0.55, 0.95) infinite;
    }
    .rig-arm-l {
      transform-box: view-box;
      transform-origin: 48px 94px;
      animation: armLAnim 3s cubic-bezier(0.45, 0.05, 0.55, 0.95) infinite;
    }
    .rig-arm-r {
      transform-box: view-box;
      transform-origin: 183px 98px;
      animation: armRAnim 3s cubic-bezier(0.45, 0.05, 0.55, 0.95) infinite;
    }
    .rig-prop {
      transform-box: fill-box;
      transform-origin: center center;
      animation: propAnim 3s cubic-bezier(0.45, 0.05, 0.55, 0.95) infinite;
    }

    /* Sinkronisasi Bayangan & LED selama 3 Detik */
    @keyframes shadowSync {
      0%, 100% { transform: scale(1); opacity: 0.8; }
      50% { transform: scale(0.88); opacity: 0.48; }
    }
    .led-1 { animation: ledPulse 3s ease-in-out infinite 0s; }
    .led-2 { animation: ledPulse 3s ease-in-out infinite 0.4s; }
    .led-3 { animation: ledPulse 3s ease-in-out infinite 0.8s; }
    @keyframes ledPulse {
      0%, 100% { fill: #0F172A; }
      50% { fill: #38BDF8; }
    }

    /* Default fallback jika bagian opsional kosong */
    @keyframes browAnim { 0%, 100% { transform: none; } }
    @keyframes glassesAnim { 0%, 100% { transform: none; } }
    @keyframes propAnim { 0%, 100% { transform: none; } }

    /* Keyframes Spesifik Karakter (Siklus 3 Detik Smooth) */
    
      @keyframes torsoAnim {
        0%, 100% { transform: translateY(0px) scale(1); }
        50% { transform: translateY(-5px) scale(1.015); }
      }
      @keyframes legLAnim {
        0%, 100% { transform: rotate(0deg); }
        50% { transform: rotate(6deg) translateY(-2px); }
      }
      @keyframes legRAnim {
        0%, 100% { transform: rotate(0deg); }
        50% { transform: rotate(-6deg) translateY(-2px); }
      }
      @keyframes antLAnim {
        0%, 100% { transform: rotate(0deg); }
        50% { transform: rotate(-7deg); }
      }
      @keyframes antRAnim {
        0%, 100% { transform: rotate(0deg); }
        50% { transform: rotate(7deg); }
      }
      @keyframes browAnim {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(-2px); }
      }
      @keyframes eyesAnim {
        0%, 44%, 52%, 100% { transform: translate(0px, 0px) scaleY(1); }
        25% { transform: translate(-2px, 0px) scaleY(1); }
        48% { transform: translate(0px, 0px) scaleY(0.1); }
        75% { transform: translate(2px, 0px) scaleY(1); }
      }
      @keyframes mouthAnim {
        0%, 100% { transform: scale(1, 1); }
        50% { transform: scale(1.15, 1.2); }
      }
      @keyframes armLAnim {
        0%, 100% { transform: rotate(0deg); }
        45% { transform: rotate(10deg); }
      }
      @keyframes armRAnim {
        0%, 100% { transform: rotate(0deg); }
        50% { transform: rotate(-8deg) translateY(-2px); }
      }
    
  </style>
</head>
<body>
  <div class="container">
    <h1 class="title">Peran Cyber Security</h1>

        </g>

        <!-- Alis (Jika ada) -->
        <g class="rig-brows">
          <path d="M80 72L100 76" stroke="#0F172A" stroke-width="3.5" stroke-linecap="round"/>
          <path d="M160 72L140 76" stroke="#0F172A" stroke-width="3.5" stroke-linecap="round"/>
        </g>

        <!-- Bola Mata (Berkedip & Melirik) -->
        <g class="rig-eyes">
          <path d="M92 92.5C96.6944 92.5 100.5 88.6944 100.5 84C100.5 79.3056 96.6944 75.5 92 75.5C87.3056 75.5 83.5 79.3056 83.5 84C83.5 88.6944 87.3056 92.5 92 92.5Z" fill="#0F172A"/>

          <path d="M148 92.5C152.694 92.5 156.5 88.6944 156.5 84C156.5 79.3056 152.694 75.5 148 75.5C143.306 75.5 139.5 79.3056 139.5 84C139.5 88.6944 143.306 92.5 148 92.5Z" fill="#0F172A"/>

        <!-- Kacamata / Visor (Tidak ikut terpejam saat mata berkedip) -->
        <g class="rig-glasses">

        <!-- Mulut -->
        <g class="rig-mouth">
          <path d="M112 96C116 102 126 102 130 94" stroke="#0F172A" stroke-width="4" stroke-linecap="round"/>
        </g>

        <!-- Objek Meja / Monitor / Laptop (Di belakang tangan) -->
        <g class="rig-desk-prop">
          
        </g>

        <!-- Tangan Kiri -->
        <g class="rig-arm-l">
          <path d="M48 94C32 86 30 68 46 62" stroke="#0F172A" stroke-width="4.5" stroke-linecap="round"/>

        <g class="rig-arm-r">

          <path d="M178.681 107.571V102.857C178.681 99.7143 186.319 99.7143 186.319 102.857V107.571" stroke="#0F172A" stroke-width="3"/>

        <!-- Properti & Efek Pendukung -->
        <g class="rig-prop">
          
        </g>
      </g>
    </svg>
  </div>
</body>
</html>
