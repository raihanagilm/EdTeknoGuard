<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ekspresi Bingung</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    }
    body {
      background-color: #ffffff;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }
    .container {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }
    .title {
      font-size: 20px;
      font-weight: 700;
      color: #0F172A;
      letter-spacing: -0.3px;
      margin-bottom: 18px;
    }
    .mascot-svg {
      display: inline-flex;
      line-height: 0;
      width: 240px;
      height: 150px;
      overflow: visible;
    }

    /* ==========================================================
       SISTEM RIGGING SMOOTH 3 DETIK (MULTI-PART NATURAL MOTION)
       ========================================================== */
    .rig-torso {
      transform-box: view-box;
      transform-origin: 120px 132px;
      animation: torsoAnim 3s cubic-bezier(0.45, 0.05, 0.55, 0.95) infinite;
    }
    .rig-leg-l {
      transform-box: view-box;
      transform-origin: 93px 130px;
      animation: legLAnim 3s cubic-bezier(0.45, 0.05, 0.55, 0.95) infinite;
    }
    .rig-leg-r {
      transform-box: view-box;
      transform-origin: 147px 130px;
      animation: legRAnim 3s cubic-bezier(0.45, 0.05, 0.55, 0.95) infinite;
    }
    .rig-antenna-l {
      transform-box: view-box;
      transform-origin: 83px 53px;
      animation: antLAnim 3s cubic-bezier(0.45, 0.05, 0.55, 0.95) infinite;
    }
    .rig-antenna-r {
      transform-box: view-box;
      transform-origin: 157px 53px;
      animation: antRAnim 3s cubic-bezier(0.45, 0.05, 0.55, 0.95) infinite;
    }
    .rig-brows {
      transform-box: fill-box;
      transform-origin: center center;
      animation: browAnim 3s cubic-bezier(0.45, 0.05, 0.55, 0.95) infinite;
    }
    .rig-eyes {
      transform-box: fill-box;
      transform-origin: center center;
      animation: eyesAnim 3s cubic-bezier(0.45, 0.05, 0.55, 0.95) infinite;
    }
    .rig-glasses {
      transform-box: fill-box;
      transform-origin: center center;
      animation: glassesAnim 3s cubic-bezier(0.45, 0.05, 0.55, 0.95) infinite;
    }
    .rig-mouth {
      transform-box: fill-box;
      transform-origin: center center;
      animation: mouthAnim 3s cubic-bezier(0.45, 0.05, 0.55, 0.95) infinite;
    }
    .rig-arm-l {
      transform-box: view-box;
      transform-origin: 48px 94px;
      animation: armLAnim 3s cubic-bezier(0.45, 0.05, 0.55, 0.95) infinite;
    }
    .rig-arm-r {
      transform-box: view-box;
      transform-origin: 196px 104px;
      animation: armRAnim 3s cubic-bezier(0.45, 0.05, 0.55, 0.95) infinite;
    }
    .rig-prop {
      transform-box: fill-box;
      transform-origin: center center;
      animation: propAnim 3s cubic-bezier(0.45, 0.05, 0.55, 0.95) infinite;
    }

    /* Sinkronisasi Bayangan & LED selama 3 Detik */
    @keyframes shadowSync {
      0%, 100% { transform: scale(1); opacity: 0.8; }
      50% { transform: scale(0.88); opacity: 0.48; }
    }
    .led-1 { animation: ledPulse 3s ease-in-out infinite 0s; }
    .led-2 { animation: ledPulse 3s ease-in-out infinite 0.4s; }
    .led-3 { animation: ledPulse 3s ease-in-out infinite 0.8s; }
    @keyframes ledPulse {
      0%, 100% { fill: #0F172A; }
      50% { fill: #F59E0B; }
    }

    /* Default fallback jika bagian opsional kosong */
    @keyframes browAnim { 0%, 100% { transform: none; } }
    @keyframes glassesAnim { 0%, 100% { transform: none; } }
    @keyframes propAnim { 0%, 100% { transform: none; } }

    /* Keyframes Spesifik Karakter (Siklus 3 Detik Smooth) */
    
      @keyframes torsoAnim {
        0%, 100% { transform: translateY(0px) rotate(0deg); }
        35% { transform: translateY(-4px) rotate(-3deg); }
        70% { transform: translateY(-2px) rotate(2deg); }
      }
      @keyframes legLAnim {
        0%, 100% { transform: rotate(0deg); }
        35% { transform: rotate(-7deg) translateY(-1px); }
        70% { transform: rotate(5deg); }
      }
      @keyframes legRAnim {
        0%, 100% { transform: rotate(0deg); }
        35% { transform: rotate(-5deg); }
        70% { transform: rotate(7deg) translateY(-1px); }
      }
      @keyframes antLAnim {
        0%, 100% { transform: rotate(0deg); }
        35% { transform: rotate(-12deg); }
        70% { transform: rotate(6deg); }
      }
      @keyframes antRAnim {
        0%, 100% { transform: rotate(0deg); }
        35% { transform: rotate(6deg); }
        70% { transform: rotate(-10deg); }
      }
      @keyframes browAnim {
        0%, 100% { transform: translateY(0px); }
        35% { transform: translateY(-3px) rotate(-3deg); }
        70% { transform: translateY(1px) rotate(2deg); }
      }
      @keyframes eyesAnim {
        0%, 44%, 52%, 100% { transform: translate(0px, 0px) scaleY(1); }
        30% { transform: translate(2px, -2px) scaleY(1); }
        48% { transform: translate(1px, -1px) scaleY(0.1); }
        75% { transform: translate(-2px, 0px) scaleY(1); }
      }
      @keyframes mouthAnim {
        0%, 100% { transform: translateX(0px) scale(1, 1); }
        35% { transform: translateX(-2px) scale(0.9, 1.2); }
        70% { transform: translateX(2px) scale(1.1, 0.9); }
      }
      @keyframes armLAnim {
        0%, 100% { transform: rotate(0deg); }
        30% { transform: rotate(-12deg); }
        60% { transform: rotate(6deg); }
      }
      @keyframes armRAnim {
        0%, 100% { transform: rotate(0deg); }
        50% { transform: rotate(-8deg); }
      }
      @keyframes propAnim {
        0%, 100% { transform: translateY(0px) rotate(0deg) scale(1); }
        50% { transform: translateY(-6px) rotate(10deg) scale(1.15); }
      }
    
  </style>
</head>
<body>
  <div class="container">
    <h1 class="title">Ekspresi Bingung</h1>
    <svg class="mascot-svg" viewBox="0 10 240 150" fill="none" xmlns="http://www.w3.org/2000/svg">

        <g class="rig-leg-l">

        </g>

        <!-- Alis (Jika ada) -->
        <g class="rig-brows">
          <path d="M82 68C88 64 96 64 102 68" stroke="#0F172A" stroke-width="4" stroke-linecap="round"/>
          <path d="M140 82C146 80 154 80 158 84" stroke="#0F172A" stroke-width="4" stroke-linecap="round"/>
        </g>

        <!-- Bola Mata (Berkedip & Melirik) -->
        <g class="rig-eyes">
          <path d="M92 91C96.9706 91 101 86.9706 101 82C101 77.0294 96.9706 73 92 73C87.0294 73 83 77.0294 83 82C83 86.9706 87.0294 91 92 91Z" fill="#0F172A"/>
          <path d="M94 83C95.6569 83 97 81.6569 97 80C97 78.3431 95.6569 77 94 77C92.3431 77 91 78.3431 91 80C91 81.6569 92.3431 83 94 83Z" fill="white"/>
          <path d="M148 95C151.866 95 155 91.866 155 88C155 84.134 151.866 81 148 81C144.134 81 141 84.134 141 88C141 91.866 144.134 95 148 95Z" fill="#0F172A"/>
          <path d="M149 89.5C150.381 89.5 151.5 88.3807 151.5 87C151.5 85.6193 150.381 84.5 149 84.5C147.619 84.5 146.5 85.6193 146.5 87C146.5 88.3807 147.619 89.5 149 89.5Z" fill="white"/>
        </g>

        <!-- Kacamata / Visor (Tidak ikut terpejam saat mata berkedip) -->
        <g class="rig-glasses">
          
        </g>

        <!-- Mulut -->
        <g class="rig-mouth">
          <path d="M112 102C118 99 124 104 128 101" stroke="#0F172A" stroke-width="3.5" stroke-linecap="round"/>
        </g>

        <!-- Objek Meja / Monitor / Laptop (Di belakang tangan) -->
        <g class="rig-desk-prop">
          
        </g>

        <!-- Tangan Kiri -->
        <g class="rig-arm-l">
          <path d="M48 94C34 84 46 62 64 60" stroke="#0F172A" stroke-width="4.5" stroke-linecap="round"/>
          <path d="M64 66C67.3137 66 70 63.3137 70 60C70 56.6863 67.3137 54 64 54C60.6863 54 58 56.6863 58 60C58 63.3137 60.6863 66 64 66Z" fill="#20C5D2" stroke="#0F172A" stroke-width="3.5"/>

        <!-- Tangan Kanan -->
        <g class="rig-arm-r">

          <path d="M208 138C211.314 138 214 135.314 214 132C214 128.686 211.314 126 208 126C204.686 126 202 128.686 202 132C202 135.314 204.686 138 208 138Z" fill="#20C5D2" stroke="#0F172A" stroke-width="3.5"/>

        <!-- Properti & Efek Pendukung -->

        </g>
      </g>
    </svg>
  </div>
</body>
</html>
