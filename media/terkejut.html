<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ekspresi Terkejut</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    }
    body {
      background-color: #ffffff;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }
    .container {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }
    .title {
      font-size: 20px;
      font-weight: 700;
      color: #0F172A;
      letter-spacing: -0.3px;
      margin-bottom: 18px;
    }
    .mascot-svg {
      width: 240px;
      height: 200px;
      overflow: visible;
    }
    .shadow {
      width: 120px;
      height: 12px;
      background: radial-gradient(ellipse at center, rgba(15, 23, 42, 0.22) 0%, rgba(15, 23, 42, 0) 70%);
      border-radius: 50%;
      margin-top: -10px;
      animation: shadowSync 3s cubic-bezier(0.45, 0.05, 0.55, 0.95) infinite;
    }

    /* ==========================================================
       SISTEM RIGGING SMOOTH 3 DETIK (MULTI-PART NATURAL MOTION)
       ========================================================== */
    .rig-torso {
      transform-box: view-box;
      transform-origin: 120px 132px;
      animation: torsoAnim 3s cubic-bezier(0.45, 0.05, 0.55, 0.95) infinite;
    }
    .rig-leg-l {
      transform-box: view-box;
      transform-origin: 93px 130px;
      animation: legLAnim 3s cubic-bezier(0.45, 0.05, 0.55, 0.95) infinite;
    }
    .rig-leg-r {
      transform-box: view-box;
      transform-origin: 147px 130px;
      animation: legRAnim 3s cubic-bezier(0.45, 0.05, 0.55, 0.95) infinite;
    }
    .rig-antenna-l {
      transform-box: view-box;
      transform-origin: 83px 53px;
      animation: antLAnim 3s cubic-bezier(0.45, 0.05, 0.55, 0.95) infinite;
    }
    .rig-antenna-r {
      transform-box: view-box;
      transform-origin: 157px 53px;
      animation: antRAnim 3s cubic-bezier(0.45, 0.05, 0.55, 0.95) infinite;
    }
    .rig-brows {
      transform-box: fill-box;
      transform-origin: center center;
      animation: browAnim 3s cubic-bezier(0.45, 0.05, 0.55, 0.95) infinite;
    }
    .rig-eyes {
      transform-box: fill-box;
      transform-origin: center center;
      animation: eyesAnim 3s cubic-bezier(0.45, 0.05, 0.55, 0.95) infinite;
    }
    .rig-glasses {
      transform-box: fill-box;
      transform-origin: center center;
      animation: glassesAnim 3s cubic-bezier(0.45, 0.05, 0.55, 0.95) infinite;
    }
    .rig-mouth {
      transform-box: fill-box;
      transform-origin: center center;
      animation: mouthAnim 3s cubic-bezier(0.45, 0.05, 0.55, 0.95) infinite;
    }
    .rig-arm-l {
      transform-box: view-box;
      transform-origin: 46px 106px;
      animation: armLAnim 3s cubic-bezier(0.45, 0.05, 0.55, 0.95) infinite;
    }
    .rig-arm-r {
      transform-box: view-box;
      transform-origin: 194px 106px;
      animation: armRAnim 3s cubic-bezier(0.45, 0.05, 0.55, 0.95) infinite;
    }
    .rig-prop {
      transform-box: fill-box;
      transform-origin: center center;
      animation: propAnim 3s cubic-bezier(0.45, 0.05, 0.55, 0.95) infinite;
    }

    /* Sinkronisasi Bayangan & LED selama 3 Detik */
    @keyframes shadowSync {
      0%, 100% { transform: scale(1); opacity: 0.8; }
      50% { transform: scale(0.88); opacity: 0.48; }
    }
    .led-1 { animation: ledPulse 3s ease-in-out infinite 0s; }
    .led-2 { animation: ledPulse 3s ease-in-out infinite 0.4s; }
    .led-3 { animation: ledPulse 3s ease-in-out infinite 0.8s; }
    @keyframes ledPulse {
      0%, 100% { fill: #0F172A; }
      50% { fill: #EF4444; }
    }

    /* Default fallback jika bagian opsional kosong */
    @keyframes browAnim { 0%, 100% { transform: none; } }
    @keyframes glassesAnim { 0%, 100% { transform: none; } }
    @keyframes propAnim { 0%, 100% { transform: none; } }

    /* Keyframes Spesifik Karakter (Siklus 3 Detik Smooth) */
    
      @keyframes torsoAnim {
        0%, 100% { transform: translateY(0px) scale(1, 1); }
        30% { transform: translateY(-8px) scale(0.97, 1.03); }
        65% { transform: translateY(-2px) scale(1.01, 0.99); }
      }
      @keyframes legLAnim {
        0%, 100% { transform: rotate(0deg); }
        30% { transform: rotate(10deg) translateY(-3px); }
        65% { transform: rotate(-4deg); }
      }
      @keyframes legRAnim {
        0%, 100% { transform: rotate(0deg); }
        30% { transform: rotate(-10deg) translateY(-3px); }
        65% { transform: rotate(4deg); }
      }
      @keyframes antLAnim {
        0%, 100% { transform: rotate(0deg); }
        30% { transform: rotate(-14deg); }
        65% { transform: rotate(4deg); }
      }
      @keyframes antRAnim {
        0%, 100% { transform: rotate(0deg); }
        30% { transform: rotate(14deg); }
        65% { transform: rotate(-4deg); }
      }
      @keyframes eyesAnim {
        0%, 50%, 58%, 100% { transform: scale(1); }
        30% { transform: scale(1.1); }
        54% { transform: scale(1, 0.12); }
      }
      @keyframes mouthAnim {
        0%, 100% { transform: scale(1, 1); }
        30% { transform: scale(1.15, 1.25); }
        65% { transform: scale(0.9, 0.85); }
      }
      @keyframes armLAnim {
        0%, 100% { transform: rotate(0deg); }
        30% { transform: rotate(14deg); }
        65% { transform: rotate(-4deg); }
      }
      @keyframes armRAnim {
        0%, 100% { transform: rotate(0deg); }
        30% { transform: rotate(-14deg); }
        65% { transform: rotate(4deg); }
      }
      @keyframes propAnim {
        0%, 100% { transform: scale(0.9); opacity: 0.6; }
        30% { transform: scale(1.25); opacity: 1; }
      }
    
  </style>
</head>
<body>
  <div class="container">
    <h1 class="title">Ekspresi Terkejut</h1>
    <svg class="mascot-svg" viewBox="0 0 240 200" fill="none" xmlns="http://www.w3.org/2000/svg">
      <!-- Badan Utama & Seluruh Anggota Tubuh Menyatu (Torso Rig) -->
      <g class="rig-torso">
        <!-- Kaki Kiri & Kaki Kanan (Menyatu di belakang bodi agar tidak pernah copot & ikut bergerak) -->
        <g class="rig-leg-l">
          <path d="M85 118V154H101V118" fill="#20C5D2"/>
          <path d="M85 118V154H101V118" stroke="#0F172A" stroke-width="4" stroke-linejoin="round"/>
        </g>
        <g class="rig-leg-r">
          <path d="M139 118V154H155V118" fill="#20C5D2"/>
          <path d="M139 118V154H155V118" stroke="#0F172A" stroke-width="4" stroke-linejoin="round"/>
        </g>

        <!-- Antena Kiri & Kanan -->
        <g class="rig-antenna-l">
          <path d="M78 53.9999L68 17.9999C67 13.9999 73 12.9999 76 15.9999L88 51.9999L78 53.9999Z" fill="#2563EB" stroke="#0F172A" stroke-width="5" stroke-linejoin="round"/>
        </g>
        <g class="rig-antenna-r">
          <path d="M162 53.9999L172 17.9999C173 13.9999 167 12.9999 164 15.9999L152 51.9999L162 53.9999Z" fill="#2563EB" stroke="#0F172A" stroke-width="5" stroke-linejoin="round"/>
        </g>

        <!-- Bodi Router -->
        <g class="rig-body">
          <path d="M58 54C72 50 168 50 182 54C196 58 206 102 200 120C196 128 178 132 120 132C62 132 44 128 40 120C34 102 44 58 58 54Z" fill="#20C5D2" stroke="#0F172A" stroke-width="5.5" stroke-linejoin="round"/>
          <path d="M44 114C70 118 170 118 196 114" stroke="#0F172A" stroke-width="3.5" stroke-linecap="round"/>
          <path d="M120 125.5C121.933 125.5 123.5 123.933 123.5 122C123.5 120.067 121.933 118.5 120 118.5C118.067 118.5 116.5 120.067 116.5 122C116.5 123.933 118.067 125.5 120 125.5Z" stroke="#0F172A" stroke-width="1.8"/>
          <path d="M120 119V122" stroke="#0F172A" stroke-width="1.8" stroke-linecap="round"/>
        </g>

        <!-- Lampu Indikator LED -->
        <g class="rig-leds">
          
          <path class="led-1" d="M64 124.5C65.3807 124.5 66.5 123.381 66.5 122C66.5 120.619 65.3807 119.5 64 119.5C62.6193 119.5 61.5 120.619 61.5 122C61.5 123.381 62.6193 124.5 64 124.5Z" fill="#0F172A"/>
          <path class="led-2" d="M72 124.5C73.3807 124.5 74.5 123.381 74.5 122C74.5 120.619 73.3807 119.5 72 119.5C70.6193 119.5 69.5 120.619 69.5 122C69.5 123.381 70.6193 124.5 72 124.5Z" fill="#0F172A"/>
          <path class="led-3" d="M80 124.5C81.3807 124.5 82.5 123.381 82.5 122C82.5 120.619 81.3807 119.5 80 119.5C78.6193 119.5 77.5 120.619 77.5 122C77.5 123.381 78.6193 124.5 80 124.5Z" fill="#0F172A"/>
        </g>

        <!-- Alis (Jika ada) -->
        <g class="rig-brows">
          
        </g>

        <!-- Bola Mata (Berkedip & Melirik) -->
        <g class="rig-eyes">
          <path d="M92 94C99.732 94 106 87.732 106 80C106 72.268 99.732 66 92 66C84.268 66 78 72.268 78 80C78 87.732 84.268 94 92 94Z" fill="white" stroke="#0F172A" stroke-width="4"/>
          <path d="M92 84.5C94.4853 84.5 96.5 82.4853 96.5 80C96.5 77.5147 94.4853 75.5 92 75.5C89.5147 75.5 87.5 77.5147 87.5 80C87.5 82.4853 89.5147 84.5 92 84.5Z" fill="#0F172A"/>
          <path d="M148 94C155.732 94 162 87.732 162 80C162 72.268 155.732 66 148 66C140.268 66 134 72.268 134 80C134 87.732 140.268 94 148 94Z" fill="white" stroke="#0F172A" stroke-width="4"/>
          <path d="M148 84.5C150.485 84.5 152.5 82.4853 152.5 80C152.5 77.5147 150.485 75.5 148 75.5C145.515 75.5 143.5 77.5147 143.5 80C143.5 82.4853 145.515 84.5 148 84.5Z" fill="#0F172A"/>
        </g>

        <!-- Kacamata / Visor (Tidak ikut terpejam saat mata berkedip) -->
        <g class="rig-glasses">
          
        </g>

        <!-- Mulut -->
        <g class="rig-mouth">
          <path d="M120 118C125.523 118 130 111.732 130 104C130 96.268 125.523 90 120 90C114.477 90 110 96.268 110 104C110 111.732 114.477 118 120 118Z" fill="#0F172A" stroke="#0F172A" stroke-width="2"/>
          <path d="M120 116C123.314 116 126 112.866 126 109C126 105.134 123.314 102 120 102C116.686 102 114 105.134 114 109C114 112.866 116.686 116 120 116Z" fill="#F87171"/>
        </g>

        <!-- Objek Meja / Monitor / Laptop (Di belakang tangan) -->
        <g class="rig-desk-prop">
          
        </g>

        <!-- Tangan Kiri -->
        <g class="rig-arm-l">
          <path d="M45.7214 106C29.7214 104 21.7214 84 37.7214 72" stroke="#0F172A" stroke-width="4.5" stroke-linecap="round"/>
          <path d="M39.7214 68C43.0351 68 45.7214 70.6863 45.7214 74C45.7214 77.3137 43.0351 80 39.7214 80C36.4077 80 33.7214 77.3137 33.7214 74C33.7214 70.6863 36.4077 68 39.7214 68Z" fill="#20C5D2" stroke="#0F172A" stroke-width="3.5"/>
        </g>

        <!-- Tangan Kanan -->
        <g class="rig-arm-r">
          <path d="M193.721 106C209.721 104 217.721 84 201.721 72" stroke="#0F172A" stroke-width="4.5" stroke-linecap="round"/>
          <path d="M199.721 68C203.035 68 205.721 70.6863 205.721 74C205.721 77.3137 203.035 80 199.721 80C196.408 80 193.721 77.3137 193.721 74C193.721 70.6863 196.408 68 199.721 68Z" fill="#20C5D2" stroke="#0F172A" stroke-width="3.5"/>
        </g>

        <!-- Properti & Efek Pendukung -->
        <g class="rig-prop">
          <path d="M60 40L70 48L62 52" stroke="#F59E0B" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
          <path d="M180 40L170 48L178 52" stroke="#F59E0B" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
        </g>
      </g>
    </svg>
    <div class="shadow"></div>
  </div>
</body>
</html>
