<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Analisis Redaman Optik</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    }
    body {
      background-color: #ffffff;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }
    .container {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }
    .title {
      font-size: 20px;
      font-weight: 700;
      color: #0F172A;
      letter-spacing: -0.3px;
      margin-bottom: 18px;
    }
    .mascot-svg {
      width: 240px;
      height: 200px;
      overflow: visible;
    }
    .shadow {
      width: 120px;
      height: 12px;
      background: radial-gradient(ellipse at center, rgba(15, 23, 42, 0.22) 0%, rgba(15, 23, 42, 0) 70%);
      border-radius: 50%;
      margin-top: -10px;
      animation: shadowSync 3s cubic-bezier(0.45, 0.05, 0.55, 0.95) infinite;
    }

    /* ==========================================================
       SISTEM RIGGING SMOOTH 3 DETIK (MULTI-PART NATURAL MOTION)
       ========================================================== */
    .rig-torso {
      transform-box: view-box;
      transform-origin: 120px 132px;
      animation: torsoAnim 3s cubic-bezier(0.45, 0.05, 0.55, 0.95) infinite;
    }
    .rig-leg-l {
      transform-box: view-box;
      transform-origin: 93px 130px;
      animation: legLAnim 3s cubic-bezier(0.45, 0.05, 0.55, 0.95) infinite;
    }
    .rig-leg-r {
      transform-box: view-box;
      transform-origin: 147px 130px;
      animation: legRAnim 3s cubic-bezier(0.45, 0.05, 0.55, 0.95) infinite;
    }
    .rig-antenna-l {
      transform-box: view-box;
      transform-origin: 83px 53px;
      animation: antLAnim 3s cubic-bezier(0.45, 0.05, 0.55, 0.95) infinite;
    }
    .rig-antenna-r {
      transform-box: view-box;
      transform-origin: 157px 53px;
      animation: antRAnim 3s cubic-bezier(0.45, 0.05, 0.55, 0.95) infinite;
    }
    .rig-brows {
      transform-box: fill-box;
      transform-origin: center center;
      animation: browAnim 3s cubic-bezier(0.45, 0.05, 0.55, 0.95) infinite;
    }
    .rig-eyes {
      transform-box: fill-box;
      transform-origin: center center;
      animation: eyesAnim 3s cubic-bezier(0.45, 0.05, 0.55, 0.95) infinite;
    }
    .rig-glasses {
      transform-box: fill-box;
      transform-origin: center center;
      animation: glassesAnim 3s cubic-bezier(0.45, 0.05, 0.55, 0.95) infinite;
    }
    .rig-mouth {
      transform-box: fill-box;
      transform-origin: center center;
      animation: mouthAnim 3s cubic-bezier(0.45, 0.05, 0.55, 0.95) infinite;
    }
    .rig-arm-l {
      transform-box: view-box;
      transform-origin: 47px 94px;
      animation: armLAnim 3s cubic-bezier(0.45, 0.05, 0.55, 0.95) infinite;
    }
    .rig-arm-r {
      transform-box: view-box;
      transform-origin: 188px 94px;
      animation: armRAnim 3s cubic-bezier(0.45, 0.05, 0.55, 0.95) infinite;
    }
    .rig-prop {
      transform-box: fill-box;
      transform-origin: center center;
      animation: propAnim 3s cubic-bezier(0.45, 0.05, 0.55, 0.95) infinite;
    }

    /* Sinkronisasi Bayangan & LED selama 3 Detik */
    @keyframes shadowSync {
      0%, 100% { transform: scale(1); opacity: 0.8; }
      50% { transform: scale(0.88); opacity: 0.48; }
    }
    .led-1 { animation: ledPulse 3s ease-in-out infinite 0s; }
    .led-2 { animation: ledPulse 3s ease-in-out infinite 0.4s; }
    .led-3 { animation: ledPulse 3s ease-in-out infinite 0.8s; }
    @keyframes ledPulse {
      0%, 100% { fill: #0F172A; }
      50% { fill: #10B981; }
    }

    /* Default fallback jika bagian opsional kosong */
    @keyframes browAnim { 0%, 100% { transform: none; } }
    @keyframes glassesAnim { 0%, 100% { transform: none; } }
    @keyframes propAnim { 0%, 100% { transform: none; } }

    /* Keyframes Spesifik Karakter (Siklus 3 Detik Smooth) */
    
      @keyframes torsoAnim {
        0%, 100% { transform: translateY(0px) rotate(0deg); }
        40% { transform: translateY(-6px) rotate(1.5deg); }
        75% { transform: translateY(-2px) rotate(-1deg); }
      }
      @keyframes legLAnim {
        0%, 100% { transform: rotate(0deg); }
        40% { transform: rotate(7deg) translateY(-2px); }
        75% { transform: rotate(-5deg); }
      }
      @keyframes legRAnim {
        0%, 100% { transform: rotate(0deg); }
        40% { transform: rotate(5deg); }
        75% { transform: rotate(-7deg) translateY(-2px); }
      }
      @keyframes antLAnim {
        0%, 100% { transform: rotate(0deg); }
        45% { transform: rotate(-7deg); }
      }
      @keyframes antRAnim {
        0%, 100% { transform: rotate(0deg); }
        45% { transform: rotate(9deg); }
      }
      @keyframes eyesAnim {
        0%, 44%, 52%, 100% { transform: translate(0px, 0px) scaleY(1); }
        30% { transform: translate(3px, -2px) scaleY(1); }
        48% { transform: translate(2px, -1px) scaleY(0.1); }
        75% { transform: translate(0px, 0px) scaleY(1); }
      }
      @keyframes mouthAnim {
        0%, 100% { transform: scale(1, 1); }
        25% { transform: scale(1.15, 1.35); }
        50% { transform: scale(0.95, 0.9); }
        75% { transform: scale(1.12, 1.25); }
      }
      @keyframes armRAnim {
        0%, 100% { transform: rotate(0deg); }
        35% { transform: rotate(-14deg); }
        70% { transform: rotate(6deg); }
      }
      @keyframes armLAnim {
        0%, 100% { transform: rotate(0deg); }
        45% { transform: rotate(10deg); }
      }
      @keyframes propAnim {
        0%, 100% { transform: translateY(0px) scale(1); }
        50% { transform: translateY(-5px) scale(1.04); }
      }
    
  </style>
</head>
<body>
  <div class="container">
    <h1 class="title">Analisis Redaman Optik</h1>
    <svg class="mascot-svg" viewBox="0 0 240 200" fill="none" xmlns="http://www.w3.org/2000/svg">
      <!-- Badan Utama & Seluruh Anggota Tubuh Menyatu (Torso Rig) -->
      <g class="rig-torso">
        <!-- Kaki Kiri & Kaki Kanan (Menyatu di belakang bodi agar tidak pernah copot & ikut bergerak) -->
        <g class="rig-leg-l">
          <path d="M85 118V154H101V118" fill="#20C5D2"/>
          <path d="M85 118V154H101V118" stroke="#0F172A" stroke-width="4" stroke-linejoin="round"/>
        </g>
        <g class="rig-leg-r">
          <path d="M139 118V154H155V118" fill="#20C5D2"/>
          <path d="M139 118V154H155V118" stroke="#0F172A" stroke-width="4" stroke-linejoin="round"/>
        </g>

        <!-- Antena Kiri & Kanan -->
        <g class="rig-antenna-l">
          <path d="M78 53.9999L68 17.9999C67 13.9999 73 12.9999 76 15.9999L88 51.9999L78 53.9999Z" fill="#2563EB" stroke="#0F172A" stroke-width="5" stroke-linejoin="round"/>
        </g>
        <g class="rig-antenna-r">
          <path d="M162 53.9999L172 17.9999C173 13.9999 167 12.9999 164 15.9999L152 51.9999L162 53.9999Z" fill="#2563EB" stroke="#0F172A" stroke-width="5" stroke-linejoin="round"/>
        </g>

        <!-- Bodi Router -->
        <g class="rig-body">
          <path d="M58 54C72 50 168 50 182 54C196 58 206 102 200 120C196 128 178 132 120 132C62 132 44 128 40 120C34 102 44 58 58 54Z" fill="#20C5D2" stroke="#0F172A" stroke-width="5.5" stroke-linejoin="round"/>
          <path d="M44 114C70 118 170 118 196 114" stroke="#0F172A" stroke-width="3.5" stroke-linecap="round"/>
          <path d="M120 125.5C121.933 125.5 123.5 123.933 123.5 122C123.5 120.067 121.933 118.5 120 118.5C118.067 118.5 116.5 120.067 116.5 122C116.5 123.933 118.067 125.5 120 125.5Z" stroke="#0F172A" stroke-width="1.8"/>
          <path d="M120 119V122" stroke="#0F172A" stroke-width="1.8" stroke-linecap="round"/>
        </g>

        <!-- Lampu Indikator LED -->
        <g class="rig-leds">
          
          <path class="led-1" d="M64 124.5C65.3807 124.5 66.5 123.381 66.5 122C66.5 120.619 65.3807 119.5 64 119.5C62.6193 119.5 61.5 120.619 61.5 122C61.5 123.381 62.6193 124.5 64 124.5Z" fill="#0F172A"/>
          <path class="led-2" d="M72 124.5C73.3807 124.5 74.5 123.381 74.5 122C74.5 120.619 73.3807 119.5 72 119.5C70.6193 119.5 69.5 120.619 69.5 122C69.5 123.381 70.6193 124.5 72 124.5Z" fill="#0F172A"/>
          <path class="led-3" d="M80 124.5C81.3807 124.5 82.5 123.381 82.5 122C82.5 120.619 81.3807 119.5 80 119.5C78.6193 119.5 77.5 120.619 77.5 122C77.5 123.381 78.6193 124.5 80 124.5Z" fill="#0F172A"/>
        </g>

        <!-- Alis (Jika ada) -->
        <g class="rig-brows">
          
        </g>

        <!-- Bola Mata (Berkedip & Melirik) -->
        <g class="rig-eyes">
          <path d="M92 92.5C96.6944 92.5 100.5 88.6944 100.5 84C100.5 79.3056 96.6944 75.5 92 75.5C87.3056 75.5 83.5 79.3056 83.5 84C83.5 88.6944 87.3056 92.5 92 92.5Z" fill="#0F172A"/>
          <path d="M94.5 84.5C96.1569 84.5 97.5 83.1569 97.5 81.5C97.5 79.8431 96.1569 78.5 94.5 78.5C92.8431 78.5 91.5 79.8431 91.5 81.5C91.5 83.1569 92.8431 84.5 94.5 84.5Z" fill="white"/>
          <path d="M148 92.5C152.694 92.5 156.5 88.6944 156.5 84C156.5 79.3056 152.694 75.5 148 75.5C143.306 75.5 139.5 79.3056 139.5 84C139.5 88.6944 143.306 92.5 148 92.5Z" fill="#0F172A"/>
          <path d="M150.5 84.5C152.157 84.5 153.5 83.1569 153.5 81.5C153.5 79.8431 152.157 78.5 150.5 78.5C148.843 78.5 147.5 79.8431 147.5 81.5C147.5 83.1569 148.843 84.5 150.5 84.5Z" fill="white"/>
        </g>

        <!-- Kacamata / Visor (Tidak ikut terpejam saat mata berkedip) -->
        <g class="rig-glasses">
          
        </g>

        <!-- Mulut -->
        <g class="rig-mouth">
          <path d="M112 95C114 103 126 103 128 95" stroke="#0F172A" stroke-width="4" stroke-linecap="round"/>
        </g>

        <!-- Objek Meja / Monitor / Laptop (Di belakang tangan) -->
        <g class="rig-desk-prop">
          
        </g>

        <!-- Tangan Kiri -->
        <g class="rig-arm-l">
          <path d="M46.9984 94.3059C26.9995 94.1003 21.2465 70.0399 23.4314 52.0614" stroke="#0F172A" stroke-width="4.5" stroke-linecap="round"/>
          <path d="M17.4317 51.9998C17.4658 48.6862 20.1795 46.0277 23.4931 46.0618C26.8066 46.0958 29.4651 48.8096 29.4311 52.1231C29.397 55.4367 26.6832 58.0952 23.3697 58.0611C20.0562 58.0271 17.3976 55.3133 17.4317 51.9998Z" fill="#20C5D2" stroke="#0F172A" stroke-width="3.5"/>
        </g>

        <!-- Tangan Kanan -->
        <g class="rig-arm-r">
          <path d="M188 94C200 90 208 72 202 60" stroke="#0F172A" stroke-width="4.5" stroke-linecap="round"/>
          <path d="M202 65C204.761 65 207 62.7614 207 60C207 57.2386 204.761 55 202 55C199.239 55 197 57.2386 197 60C197 62.7614 199.239 65 202 65Z" fill="#20C5D2" stroke="#0F172A" stroke-width="3.5"/>
          <path d="M202 60L204 50" stroke="#0F172A" stroke-width="3.5" stroke-linecap="round"/>
        </g>

        <!-- Properti & Efek Pendukung -->
        <g class="rig-prop">
          <path d="M226 32H180C176.686 32 174 34.6863 174 38V66C174 69.3137 176.686 72 180 72H226C229.314 72 232 69.3137 232 66V38C232 34.6863 229.314 32 226 32Z" fill="#F0FDFA" stroke="#20C5D2" stroke-width="3.5"/>
          <path d="M180 56L190 48L202 60L214 44L224 52" stroke="#2563EB" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
          <path d="M190 50.5C191.381 50.5 192.5 49.3807 192.5 48C192.5 46.6193 191.381 45.5 190 45.5C188.619 45.5 187.5 46.6193 187.5 48C187.5 49.3807 188.619 50.5 190 50.5Z" fill="#20C5D2"/>
          <path d="M202 62.5C203.381 62.5 204.5 61.3807 204.5 60C204.5 58.6193 203.381 57.5 202 57.5C200.619 57.5 199.5 58.6193 199.5 60C199.5 61.3807 200.619 62.5 202 62.5Z" fill="#20C5D2"/>
          <path d="M214 46.5C215.381 46.5 216.5 45.3807 216.5 44C216.5 42.6193 215.381 41.5 214 41.5C212.619 41.5 211.5 42.6193 211.5 44C211.5 45.3807 212.619 46.5 214 46.5Z" fill="#10B981"/>
        </g>
      </g>
    </svg>
    <div class="shadow"></div>
  </div>
</body>
</html>
