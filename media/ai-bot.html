<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Peran Smart AI Bot</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    }
    body {
      background-color: #ffffff;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }
    .container {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }
    .title {
      font-size: 20px;
      font-weight: 700;
      color: #0F172A;
      letter-spacing: -0.3px;
      margin-bottom: 18px;
    }
    .mascot-svg {
      width: 240px;
      height: 200px;
      overflow: visible;
    }
    .shadow {
      width: 120px;
      height: 12px;
      background: radial-gradient(ellipse at center, rgba(15, 23, 42, 0.22) 0%, rgba(15, 23, 42, 0) 70%);
      border-radius: 50%;
      margin-top: -10px;
      animation: shadowSync 3s cubic-bezier(0.45, 0.05, 0.55, 0.95) infinite;
    }

    /* ==========================================================
       SISTEM RIGGING SMOOTH 3 DETIK (MULTI-PART NATURAL MOTION)
       ========================================================== */
    .rig-torso {
      transform-box: view-box;
      transform-origin: 120px 132px;
      animation: torsoAnim 3s cubic-bezier(0.45, 0.05, 0.55, 0.95) infinite;
    }
    .rig-leg-l {
      transform-box: view-box;
      transform-origin: 93px 130px;
      animation: legLAnim 3s cubic-bezier(0.45, 0.05, 0.55, 0.95) infinite;
    }
    .rig-leg-r {
      transform-box: view-box;
      transform-origin: 147px 130px;
      animation: legRAnim 3s cubic-bezier(0.45, 0.05, 0.55, 0.95) infinite;
    }
    .rig-antenna-l {
      transform-box: view-box;
      transform-origin: 83px 53px;
      animation: antLAnim 3s cubic-bezier(0.45, 0.05, 0.55, 0.95) infinite;
    }
    .rig-antenna-r {
      transform-box: view-box;
      transform-origin: 157px 53px;
      animation: antRAnim 3s cubic-bezier(0.45, 0.05, 0.55, 0.95) infinite;
    }
    .rig-brows {
      transform-box: fill-box;
      transform-origin: center center;
      animation: browAnim 3s cubic-bezier(0.45, 0.05, 0.55, 0.95) infinite;
    }
    .rig-eyes {
      transform-box: fill-box;
      transform-origin: center center;
      animation: eyesAnim 3s cubic-bezier(0.45, 0.05, 0.55, 0.95) infinite;
    }
    .rig-glasses {
      transform-box: fill-box;
      transform-origin: center center;
      animation: glassesAnim 3s cubic-bezier(0.45, 0.05, 0.55, 0.95) infinite;
    }
    .rig-mouth {
      transform-box: fill-box;
      transform-origin: center center;
      animation: mouthAnim 3s cubic-bezier(0.45, 0.05, 0.55, 0.95) infinite;
    }
    .rig-arm-l {
      transform-box: view-box;
      transform-origin: 46px 94px;
      animation: armLAnim 3s cubic-bezier(0.45, 0.05, 0.55, 0.95) infinite;
    }
    .rig-arm-r {
      transform-box: view-box;
      transform-origin: 194px 94px;
      animation: armRAnim 3s cubic-bezier(0.45, 0.05, 0.55, 0.95) infinite;
    }
    .rig-prop {
      transform-box: fill-box;
      transform-origin: center center;
      animation: propAnim 3s cubic-bezier(0.45, 0.05, 0.55, 0.95) infinite;
    }

    /* Sinkronisasi Bayangan & LED selama 3 Detik */
    @keyframes shadowSync {
      0%, 100% { transform: scale(1); opacity: 0.8; }
      50% { transform: scale(0.88); opacity: 0.48; }
    }
    .led-1 { animation: ledPulse 3s ease-in-out infinite 0s; }
    .led-2 { animation: ledPulse 3s ease-in-out infinite 0.4s; }
    .led-3 { animation: ledPulse 3s ease-in-out infinite 0.8s; }
    @keyframes ledPulse {
      0%, 100% { fill: #0F172A; }
      50% { fill: #38BDF8; }
    }

    /* Default fallback jika bagian opsional kosong */
    @keyframes browAnim { 0%, 100% { transform: none; } }
    @keyframes glassesAnim { 0%, 100% { transform: none; } }
    @keyframes propAnim { 0%, 100% { transform: none; } }

    /* Keyframes Spesifik Karakter (Siklus 3 Detik Smooth) */
    
      @keyframes torsoAnim {
        0%, 100% { transform: translateY(0px) rotate(0deg); }
        50% { transform: translateY(-8px) rotate(1deg); }
      }
      @keyframes legLAnim {
        0%, 100% { transform: scale(1); opacity: 0.9; }
        50% { transform: scale(1.08); opacity: 1; }
      }
      @keyframes legRAnim {
        0%, 100% { transform: scale(1) translateY(0px); opacity: 0.75; }
        50% { transform: scale(0.92) translateY(4px); opacity: 1; }
      }
      @keyframes antLAnim {
        0%, 100% { transform: rotate(0deg); }
        50% { transform: rotate(-10deg); }
      }
      @keyframes antRAnim {
        0%, 100% { transform: rotate(0deg); }
        50% { transform: rotate(10deg); }
      }
      @keyframes eyesAnim {
        0%, 44%, 52%, 100% { transform: translate(0px, 0px) scaleY(1); }
        25% { transform: translate(2px, -1px) scaleY(1.05); }
        48% { transform: translate(0px, 0px) scaleY(0.1); }
        75% { transform: translate(-2px, -1px) scaleY(1.05); }
      }
      @keyframes mouthAnim {
        0%, 100% { transform: scale(1, 1); }
        30% { transform: scale(1.18, 1.32); }
        65% { transform: scale(0.94, 0.88); }
      }
      @keyframes armLAnim {
        0%, 100% { transform: rotate(0deg); }
        50% { transform: rotate(-12deg); }
      }
      @keyframes armRAnim {
        0%, 100% { transform: rotate(0deg); }
        50% { transform: rotate(12deg); }
      }
      @keyframes propAnim {
        0%, 100% { transform: scale(0.85) translateY(0px); opacity: 0.7; }
        50% { transform: scale(1.2) translateY(-4px); opacity: 1; }
      }
    
  </style>
</head>
<body>
  <div class="container">
    <h1 class="title">Peran Smart AI Bot</h1>
    <svg class="mascot-svg" viewBox="0 0 240 200" fill="none" xmlns="http://www.w3.org/2000/svg">
      <!-- Badan Utama & Seluruh Anggota Tubuh Menyatu (Torso Rig) -->
      <g class="rig-torso">
        <!-- Kaki Kiri & Kaki Kanan (Menyatu di belakang bodi agar tidak pernah copot & ikut bergerak) -->
        <g class="rig-leg-l">
          <path d="M121 154C139.778 154 155 150.418 155 146C155 141.582 139.778 138 121 138C102.222 138 87 141.582 87 146C87 150.418 102.222 154 121 154Z" fill="#2563EB" stroke="#0F172A" stroke-width="4"/>
        </g>
        <g class="rig-leg-r">
          <path d="M121 165C134.255 165 145 162.761 145 160C145 157.239 134.255 155 121 155C107.745 155 97 157.239 97 160C97 162.761 107.745 165 121 165Z" stroke="#20C5D2" stroke-width="3"/>
          <path d="M121 173C128.732 173 135 171.657 135 170C135 168.343 128.732 167 121 167C113.268 167 107 168.343 107 170C107 171.657 113.268 173 121 173Z" stroke="#20C5D2" stroke-width="2.5"/>
        </g>

        <!-- Antena Kiri & Kanan -->
        <g class="rig-antenna-l">
          <path d="M78 53.9999L68 17.9999C67 13.9999 73 12.9999 76 15.9999L88 51.9999L78 53.9999Z" fill="#2563EB" stroke="#0F172A" stroke-width="5" stroke-linejoin="round"/>
        </g>
        <g class="rig-antenna-r">
          <path d="M162 53.9999L172 17.9999C173 13.9999 167 12.9999 164 15.9999L152 51.9999L162 53.9999Z" fill="#2563EB" stroke="#0F172A" stroke-width="5" stroke-linejoin="round"/>
        </g>

        <!-- Bodi Router -->
        <g class="rig-body">
          <path d="M58 54C72 50 168 50 182 54C196 58 206 102 200 120C196 128 178 132 120 132C62 132 44 128 40 120C34 102 44 58 58 54Z" fill="#20C5D2" stroke="#0F172A" stroke-width="5.5" stroke-linejoin="round"/>
          <path d="M44 114C70 118 170 118 196 114" stroke="#0F172A" stroke-width="3.5" stroke-linecap="round"/>
          <path d="M120 125.5C121.933 125.5 123.5 123.933 123.5 122C123.5 120.067 121.933 118.5 120 118.5C118.067 118.5 116.5 120.067 116.5 122C116.5 123.933 118.067 125.5 120 125.5Z" stroke="#0F172A" stroke-width="1.8"/>
          <path d="M120 119V122" stroke="#0F172A" stroke-width="1.8" stroke-linecap="round"/>
        </g>

        <!-- Lampu Indikator LED -->
        <g class="rig-leds">
          
          <path class="led-1" d="M64 124.5C65.3807 124.5 66.5 123.381 66.5 122C66.5 120.619 65.3807 119.5 64 119.5C62.6193 119.5 61.5 120.619 61.5 122C61.5 123.381 62.6193 124.5 64 124.5Z" fill="#0F172A"/>
          <path class="led-2" d="M72 124.5C73.3807 124.5 74.5 123.381 74.5 122C74.5 120.619 73.3807 119.5 72 119.5C70.6193 119.5 69.5 120.619 69.5 122C69.5 123.381 70.6193 124.5 72 124.5Z" fill="#0F172A"/>
          <path class="led-3" d="M80 124.5C81.3807 124.5 82.5 123.381 82.5 122C82.5 120.619 81.3807 119.5 80 119.5C78.6193 119.5 77.5 120.619 77.5 122C77.5 123.381 78.6193 124.5 80 124.5Z" fill="#0F172A"/>
        </g>

        <!-- Alis (Jika ada) -->
        <g class="rig-brows">
          
        </g>

        <!-- Bola Mata (Berkedip & Melirik) -->
        <g class="rig-eyes">
          <path d="M92 93.5C97.2467 93.5 101.5 89.2467 101.5 84C101.5 78.7533 97.2467 74.5 92 74.5C86.7533 74.5 82.5 78.7533 82.5 84C82.5 89.2467 86.7533 93.5 92 93.5Z" fill="#0F172A"/>
          <path d="M92 89C94.7614 89 97 86.7614 97 84C97 81.2386 94.7614 79 92 79C89.2386 79 87 81.2386 87 84C87 86.7614 89.2386 89 92 89Z" fill="#20C5D2"/>
          <path d="M148 93.5C153.247 93.5 157.5 89.2467 157.5 84C157.5 78.7533 153.247 74.5 148 74.5C142.753 74.5 138.5 78.7533 138.5 84C138.5 89.2467 142.753 93.5 148 93.5Z" fill="#0F172A"/>
          <path d="M148 89C150.761 89 153 86.7614 153 84C153 81.2386 150.761 79 148 79C145.239 79 143 81.2386 143 84C143 86.7614 145.239 89 148 89Z" fill="#20C5D2"/>
        </g>

        <!-- Kacamata / Visor (Tidak ikut terpejam saat mata berkedip) -->
        <g class="rig-glasses">
          
        </g>

        <!-- Mulut -->
        <g class="rig-mouth">
          <path d="M112 95C114 103 126 103 128 95" stroke="#0F172A" stroke-width="4" stroke-linecap="round"/>
        </g>

        <!-- Objek Meja / Monitor / Laptop (Di belakang tangan) -->
        <g class="rig-desk-prop">
          
        </g>

        <!-- Tangan Kiri -->
        <g class="rig-arm-l">
          <path d="M46 94C30 98 30 114 46 116" stroke="#0F172A" stroke-width="4.5" stroke-linecap="round"/>
          <path d="M46 122C49.3137 122 52 119.314 52 116C52 112.686 49.3137 110 46 110C42.6863 110 40 112.686 40 116C40 119.314 42.6863 122 46 122Z" fill="#20C5D2" stroke="#0F172A" stroke-width="3.5"/>
        </g>

        <!-- Tangan Kanan -->
        <g class="rig-arm-r">
          <path d="M194 94C210 98 210 114 194 116" stroke="#0F172A" stroke-width="4.5" stroke-linecap="round"/>
          <path d="M194 122C197.314 122 200 119.314 200 116C200 112.686 197.314 110 194 110C190.686 110 188 112.686 188 116C188 119.314 190.686 122 194 122Z" fill="#20C5D2" stroke="#0F172A" stroke-width="3.5"/>
        </g>

        <!-- Properti & Efek Pendukung -->
        <g class="rig-prop">
          <path d="M120 12L123 22L133 25L123 28L120 38L117 28L107 25L117 22L120 12Z" fill="#F59E0B" stroke="#0F172A" stroke-width="2" stroke-linejoin="round"/>
          <path d="M30 48L32 54L38 56L32 58L30 64L28 58L22 56L28 54L30 48Z" fill="#20C5D2"/>
          <path d="M210 48L212 54L218 56L212 58L210 64L208 58L202 56L208 54L210 48Z" fill="#20C5D2"/>
        </g>
      </g>
    </svg>
    <div class="shadow"></div>
  </div>
</body>
</html>
