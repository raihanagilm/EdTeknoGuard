<!DOCTYPE html>
<html lang="id" class="h-full bg-slate-50 text-slate-900 antialiased">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0">
    <title>Login Admin — {{ app_name }}</title>

    <!-- Google Fonts: Plus Jakarta Sans -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <!-- Dedicated Clean White Login CSS (Separated CSS) -->
    <link rel="stylesheet" href="/static/css/login.css">
</head>

<body class="login-page-body">

    <!-- Main Wrapper Container (Mobile-first, max-w-420px) -->
    <main class="login-wrapper-container" id="loginWrapper">
        
        <!-- Header Branding Component -->
        <header class="login-header-section" id="loginHeader">
            <div class="login-brand-icon-box" id="loginBrandIcon">
                <svg class="login-brand-icon-svg" fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m5.618-4.016A11.955 11.955 0 0112 2.944a11.955 11.955 0 01-8.618 3.04A12.02 12.02 0 003 9c0 5.591 3.824 10.29 9 11.622 5.176-1.332 9-6.03 9-11.622 0-1.042-.133-2.052-.382-3.016z"/>
                </svg>
            </div>
            <h1 class="login-brand-title" id="loginBrandTitle">
                Tekno<span class="login-brand-title-accent">Guard</span>
            </h1>
            <p class="login-brand-subtitle" id="loginBrandSubtitle">
                Portal Otentikasi Administrator NOC &amp; Jaringan ONT
            </p>
        </header>

        <!-- Login Card Component -->
        <section class="login-card-container" id="loginCard">
            
            <!-- Error Alert Banner -->
            {% if error %}
            <div class="login-alert-banner login-alert-banner--error" id="loginAlertError" role="alert">
                <svg class="login-alert-icon" fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/>
                </svg>
                <span>{{ error }}</span>
            </div>
            {% endif %}

            <!-- Success Alert Banner -->
            {% if success %}
            <div class="login-alert-banner login-alert-banner--success" id="loginAlertSuccess" role="status">
                <svg class="login-alert-icon" fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"/>
                </svg>
                <span>{{ success }}</span>
            </div>
            {% endif %}

            <!-- Login Form -->
            <form action="/login" method="POST" id="loginForm">
                
                <!-- Form Group 1: Username Input -->
                <div class="login-form-group" id="formGroupUsername">
                    <label class="login-field-label" for="username">
                        Username <span class="login-field-required" aria-hidden="true">*</span>
                    </label>
                    <div class="login-input-relative-wrapper">
                        <div class="login-input-leading-icon" aria-hidden="true">
                            <svg class="w-4 h-4" style="width: 1rem; height: 1rem;" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"/>
                            </svg>
                        </div>
                        <input type="text"
                               id="username"
                               name="username"
                               required
                               autocomplete="username"
                               placeholder="Masukkan username admin"
                               class="login-input-field">
                    </div>
                </div>

                <!-- Form Group 2: Password Input with Eye Visibility Toggle -->
                <div class="login-form-group" id="formGroupPassword">
                    <label class="login-field-label" for="password">
                        Password <span class="login-field-required" aria-hidden="true">*</span>
                    </label>
                    <div class="login-input-relative-wrapper">
                        <div class="login-input-leading-icon" aria-hidden="true">
                            <svg class="w-4 h-4" style="width: 1rem; height: 1rem;" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"/>
                            </svg>
                        </div>
                        <input type="password"
                               id="password"
                               name="password"
                               required
                               autocomplete="current-password"
                               placeholder="Masukkan password admin"
                               class="login-input-field login-input-field--password">
                        
                        <!-- Toggle Password Button (Touch Target >= 44x44px) -->
                        <button type="button"
                                id="togglePasswordBtn"
                                class="login-password-toggle-button"
                                title="Lihat password"
                                aria-label="Lihat password">
                            <!-- Eye Open SVG (Default hidden password) -->
                            <svg id="eyeOpenIcon" style="width: 1.125rem; height: 1.125rem;" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z" />
                            </svg>
                            <!-- Eye Slash SVG (Visible password) -->
                            <svg id="eyeSlashIcon" style="width: 1.125rem; height: 1.125rem; display: none;" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13.875 18.825A10.05 10.05 0 0112 19c-4.478 0-8.268-2.943-9.543-7a9.97 9.97 0 011.563-3.029m5.858.908a3 3 0 114.243 4.243M9.878 9.878l4.242 4.242M9.88 9.88l-3.29-3.29m7.532 7.532l3.29 3.29M3 3l18 18" />
                            </svg>
                        </button>
                    </div>
                </div>

                <!-- Form Group 3: Remember Me Checkbox (Ingat Saya) -->
                <div class="login-remember-wrapper" id="rememberMeWrapper">
                    <label class="login-remember-label" for="remember_me">
                        <input type="checkbox"
                               id="remember_me"
                               name="remember_me"
                               class="login-remember-checkbox">
                        <span>Ingat saya</span>
                    </label>
                </div>

                <!-- Form Group 4: Submit Button (Touch Target >= 44px) -->
                <button type="submit"
                        id="loginSubmitBtn"
                        class="login-submit-button">
                    <span>Masuk ke Dashboard</span>
                    <svg class="login-submit-icon" fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14 5l7 7m0 0l-7 7m7-7H3"/>
                    </svg>
                </button>

            </form>

            <!-- Card Footer Note -->
            <footer class="login-card-footer" id="loginFooterNote">
                <span class="login-card-footer-text">
                    Sistem Pemantau Jaringan ISP &bull; Standar Keamanan NOC
                </span>
            </footer>

        </section>

    </main>

    <!-- Dedicated Clean JavaScript (Separated JS) -->
    <script src="/static/js/login.js"></script>

</body>
</html>
