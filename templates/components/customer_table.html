<!-- Daftar Pelanggan & Status Redaman ONT (Responsive: Desktop Table + Mobile Cards) -->
<div class="bg-white rounded-2xl border border-slate-200 shadow-sm overflow-hidden mb-8">

    <!-- Header & Filter Bar -->
    <div class="p-4 sm:p-5 border-b border-slate-200 bg-white">
        <div class="flex flex-col md:flex-row items-stretch md:items-center justify-between gap-3">
            
            <!-- Pencarian Cepat -->
            <div class="relative flex-1">
                <div class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-slate-400">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/></svg>
                </div>
                <input type="text"
                       x-model="searchQuery"
                       @input.debounce.300ms="fetchCustomers()"
                       placeholder="Cari nama, IP (10.10.x.x), MAC, atau ID pelanggan..."
                       class="w-full pl-9 pr-4 py-2.5 rounded-xl border border-slate-300 text-xs sm:text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 min-h-[44px]">
            </div>

            <!-- Filter Dropdown POP & Status -->
            <div class="flex items-center gap-2.5">
                <!-- Filter POP -->
                <select x-model="selectedPop"
                        @change="fetchCustomers()"
                        class="px-3 py-2.5 rounded-xl border border-slate-300 text-xs sm:text-sm bg-white focus:outline-none focus:ring-2 focus:ring-indigo-500 min-h-[44px]">
                    <option value="Semua POP">Semua POP</option>
                    {% for pop in unique_pops %}
                    <option value="{{ pop }}">{{ pop }}</option>
                    {% endfor %}
                </select>

                <!-- Filter Status -->
                <select x-model="selectedStatus"
                        @change="fetchCustomers()"
                        class="px-3 py-2.5 rounded-xl border border-slate-300 text-xs sm:text-sm bg-white focus:outline-none focus:ring-2 focus:ring-indigo-500 min-h-[44px]">
                    <option value="Semua Status">Semua Status</option>
                    <option value="NORMAL">Normal (&gt; -26 dBm)</option>
                    <option value="WARNING">Warning (&le; -26.0 dBm)</option>
                    <option value="CRITICAL">Critical (&le; -32.0 dBm)</option>
                    <option value="LOS">LOS / Mati</option>
                </select>
            </div>

        </div>
    </div>

    <!-- 1. Tampilan Desktop (Tabel Lengkap) -->
    <div class="hidden md:block overflow-x-auto">
        <table class="w-full text-left border-collapse text-xs">
            <thead>
                <tr class="bg-slate-50/80 border-b border-slate-200 text-slate-500 uppercase tracking-wider font-bold">
                    <th class="py-3.5 px-4">Pelanggan</th>
                    <th class="py-3.5 px-4">POP &amp; IP Router</th>
                    <th class="py-3.5 px-4">Perangkat Modem</th>
                    <th class="py-3.5 px-4 text-center">Baseline</th>
                    <th class="py-3.5 px-4 text-center">Redaman Terkini</th>
                    <th class="py-3.5 px-4 text-center">Status</th>
                    <th class="py-3.5 px-4 text-center">Cek Terakhir</th>
                    <th class="py-3.5 px-4 text-center">Aksi</th>
                </tr>
            </thead>
            <tbody class="divide-y divide-slate-200 text-slate-700">
                <template x-for="c in customers" :key="c.id_pelanggan">
                    <tr class="hover:bg-slate-50/60 transition group">
                        
                        <!-- Nama & ID -->
                        <td class="py-3.5 px-4">
                            <div class="font-bold text-slate-900 text-sm" x-text="c.nama"></div>
                            <div class="text-[11px] text-slate-500 flex items-center gap-1.5 mt-0.5">
                                <span class="font-mono" x-text="'ID: ' + c.id_pelanggan"></span>
                                <span x-show="c.paket" class="text-indigo-600 font-medium" x-text="'• ' + c.paket"></span>
                            </div>
                        </td>

                        <!-- POP & IP -->
                        <td class="py-3.5 px-4">
                            <span class="inline-flex items-center px-2 py-0.5 rounded text-[11px] font-semibold bg-slate-100 text-slate-700 border border-slate-200" x-text="c.pop"></span>
                            <div class="font-mono text-slate-800 font-bold text-xs mt-1" x-text="c.ip_router"></div>
                        </td>

                        <!-- Modem & MAC -->
                        <td class="py-3.5 px-4">
                            <div class="font-semibold text-slate-800" x-text="c.jenis_modem"></div>
                            <div class="font-mono text-[10px] text-slate-400" x-text="c.mac_address || '-'"></div>
                        </td>

                        <!-- Baseline -->
                        <td class="py-3.5 px-4 text-center font-mono font-medium text-slate-600">
                            <span x-text="c.redaman_baseline ? (c.redaman_baseline + ' dBm') : '-'"></span>
                        </td>

                        <!-- Current Redaman (Highlight) -->
                        <td class="py-3.5 px-4 text-center">
                            <span class="font-mono font-extrabold text-sm px-2.5 py-1 rounded-lg inline-block"
                                  :class="{
                                      'bg-emerald-50 text-emerald-700 border border-emerald-200': c.status === 'NORMAL',
                                      'bg-amber-100 text-amber-800 border border-amber-300': c.status === 'WARNING',
                                      'bg-rose-100 text-rose-800 border border-rose-300': c.status === 'CRITICAL',
                                      'bg-slate-100 text-slate-600 border border-slate-300': c.status === 'LOS'
                                  }"
                                  x-text="c.redaman_current !== null ? (c.redaman_current + ' dBm') : 'LOS'">
                            </span>
                        </td>

                        <!-- Status Badge -->
                        <td class="py-3.5 px-4 text-center">
                            <span class="px-2 py-1 rounded-full text-[10px] font-bold inline-flex items-center gap-1"
                                  :class="{
                                      'bg-emerald-50 text-emerald-700 border border-emerald-200': c.status === 'NORMAL',
                                      'bg-amber-50 text-amber-800 border border-amber-300': c.status === 'WARNING',
                                      'bg-rose-50 text-rose-700 border border-rose-200': c.status === 'CRITICAL',
                                      'bg-slate-100 text-slate-700 border border-slate-300': c.status === 'LOS'
                                  }">
                                <span class="h-1.5 w-1.5 rounded-full"
                                      :class="{
                                          'bg-emerald-500': c.status === 'NORMAL',
                                          'bg-amber-500': c.status === 'WARNING',
                                          'bg-rose-500': c.status === 'CRITICAL',
                                          'bg-slate-500': c.status === 'LOS'
                                      }"></span>
                                <span x-text="c.status"></span>
                            </span>
                        </td>

                        <!-- Last Check -->
                        <td class="py-3.5 px-4 text-center text-slate-500 font-mono text-[11px]" x-text="c.last_check"></td>

                        <!-- Action Cek Live -->
                        <td class="py-3.5 px-4 text-center">
                            <button @click="triggerScanSingle(c.id_pelanggan)"
                                    :disabled="scanningSingleId === c.id_pelanggan"
                                    title="Tembak SNMP ONT sekarang"
                                    class="inline-flex items-center gap-1 px-3 py-1.5 rounded-lg border border-indigo-200 bg-indigo-50 hover:bg-indigo-100 text-indigo-700 font-bold text-xs transition disabled:opacity-50 min-h-[36px]">
                                <svg x-show="scanningSingleId !== c.id_pelanggan" class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z"/></svg>
                                <svg x-show="scanningSingleId === c.id_pelanggan" class="animate-spin w-3.5 h-3.5 text-indigo-600" fill="none" viewBox="0 0 24 24"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path></svg>
                                <span x-text="scanningSingleId === c.id_pelanggan ? 'Mengecek...' : 'Cek Live'">Cek Live</span>
                            </button>
                        </td>

                    </tr>
                </template>
            </tbody>
        </table>
    </div>

    <!-- 2. Tampilan Mobile (Kartu Kontak Interaktif) -->
    <div class="block md:hidden divide-y divide-slate-200">
        <template x-for="c in customers" :key="c.id_pelanggan">
            <div class="p-4 hover:bg-slate-50 transition">
                <div class="flex items-start justify-between gap-2 mb-2">
                    <div>
                        <div class="font-bold text-slate-900 text-base" x-text="c.nama"></div>
                        <div class="text-xs text-slate-500 flex items-center gap-1.5 mt-0.5">
                            <span class="font-mono" x-text="c.id_pelanggan"></span>
                            <span>•</span>
                            <span class="font-medium text-slate-700" x-text="c.pop"></span>
                        </div>
                    </div>
                    <!-- Redaman Current Badge -->
                    <span class="font-mono font-extrabold text-sm px-2.5 py-1 rounded-lg"
                          :class="{
                              'bg-emerald-50 text-emerald-700 border border-emerald-200': c.status === 'NORMAL',
                              'bg-amber-100 text-amber-800 border border-amber-300': c.status === 'WARNING',
                              'bg-rose-100 text-rose-800 border border-rose-300': c.status === 'CRITICAL',
                              'bg-slate-100 text-slate-600 border border-slate-300': c.status === 'LOS'
                          }"
                          x-text="c.redaman_current !== null ? (c.redaman_current + ' dBm') : 'LOS'">
                    </span>
                </div>

                <div class="grid grid-cols-2 gap-2 text-xs bg-slate-50 p-2.5 rounded-xl border border-slate-100 my-2.5">
                    <div>
                        <span class="text-slate-400 block text-[10px]">IP Router ONT</span>
                        <span class="font-mono font-bold text-slate-800" x-text="c.ip_router"></span>
                    </div>
                    <div>
                        <span class="text-slate-400 block text-[10px]">Modem / Baseline</span>
                        <span class="font-medium text-slate-700" x-text="c.jenis_modem"></span>
                    </div>
                </div>

                <div class="flex items-center justify-between gap-2 mt-3 pt-2">
                    <span class="text-[11px] text-slate-400 font-mono" x-text="'Cek: ' + c.last_check"></span>

                    <button @click="triggerScanSingle(c.id_pelanggan)"
                            :disabled="scanningSingleId === c.id_pelanggan"
                            class="inline-flex items-center gap-1.5 px-4 py-2 rounded-xl bg-indigo-50 border border-indigo-200 text-indigo-700 font-bold text-xs hover:bg-indigo-100 transition min-h-[44px]">
                        <svg class="w-4 h-4 text-indigo-600" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z"/></svg>
                        <span x-text="scanningSingleId === c.id_pelanggan ? 'Mengecek...' : 'Cek Live Sekarang'">Cek Live Sekarang</span>
                    </button>
                </div>
            </div>
        </template>
    </div>

    <!-- Empty State -->
    <div x-show="customers.length === 0" class="p-8 text-center text-slate-500">
        <svg class="mx-auto h-12 w-12 text-slate-300" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9.172 16.172a4 4 0 015.656 0M9 10h.01M15 10h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>
        <p class="mt-2 text-sm font-semibold text-slate-700">Tidak ada pelanggan yang cocok dengan pencarian.</p>
        <p class="text-xs text-slate-400">Silakan ubah kata kunci atau filter POP / status.</p>
    </div>

    <!-- Pagination Footer -->
    <div class="p-4 border-t border-slate-200 bg-slate-50/70 flex items-center justify-between text-xs text-slate-600">
        <span>Menampilkan <strong x-text="customers.length"></strong> dari <strong x-text="totalCustomers"></strong> pelanggan</span>
        
        <div class="flex items-center gap-2">
            <button @click="prevPage()"
                    :disabled="currentPage <= 1"
                    class="px-3 py-1.5 rounded-lg border border-slate-200 bg-white font-semibold disabled:opacity-40 min-h-[38px]">
                Sebelumnya
            </button>
            <span class="font-mono font-bold text-slate-800" x-text="currentPage"></span>
            <button @click="nextPage()"
                    :disabled="customers.length < pageSize"
                    class="px-3 py-1.5 rounded-lg border border-slate-200 bg-white font-semibold disabled:opacity-40 min-h-[38px]">
                Berikutnya
            </button>
        </div>
    </div>

</div>
