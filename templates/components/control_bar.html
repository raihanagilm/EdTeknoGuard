<!-- Control Bar: Status Engine & Tombol Kontrol Cerdas Tunggal -->
<div class="bg-white rounded-2xl p-4 sm:p-5 border border-slate-200 shadow-sm mb-6 flex flex-col md:flex-row items-stretch md:items-center justify-between gap-4">
    
    <!-- Sisi Kiri: Status Pemantau Otomatis -->
    <div class="flex items-center gap-3.5">
        <div class="h-4 w-4 rounded-full flex items-center justify-center flex-shrink-0"
             :class="engineStatus === 'RUNNING' ? 'bg-emerald-500 shadow-sm shadow-emerald-200' : 'bg-slate-400'">
            <div class="h-2 w-2 rounded-full bg-white"
                 :class="engineStatus === 'RUNNING' ? 'animate-ping' : ''"></div>
        </div>
        <div>
            <div class="flex items-center gap-2 flex-wrap">
                <span class="text-sm font-bold text-slate-900"
                      x-text="engineStatus === 'RUNNING' ? `Pemantauan Otomatis: AKTIF (Tiap ${intervalMinutes} Menit)` : 'Pemantauan Otomatis: DIJEDA (Mati)'">
                    Pemantauan Otomatis: AKTIF
                </span>
                <span class="px-2.5 py-0.5 rounded-full text-[10px] font-extrabold uppercase tracking-wide"
                      :class="engineStatus === 'RUNNING' ? 'bg-emerald-50 text-emerald-700 border border-emerald-200' : 'bg-slate-100 text-slate-600 border border-slate-200'"
                      x-text="engineStatus">
                    RUNNING
                </span>
            </div>
            <div class="text-xs text-slate-500 flex items-center gap-1.5 mt-0.5">
                <span>Pengecekan Terakhir:</span>
                <strong class="text-slate-700 font-mono font-semibold" x-text="lastScanTime || '{{ last_scan_time }}'">{{ last_scan_time }}</strong>
                <span class="text-slate-300">|</span>
                <span class="text-[11px] text-slate-400" x-text="engineStatus === 'RUNNING' ? 'Background worker memindai berkala' : 'Background worker tidak aktif'"></span>
            </div>
        </div>
    </div>

    <!-- Sisi Kanan: Tombol Kontrol Tunggal Cerdas (Mulai/Cek vs Jeda) -->
    <div class="flex items-center gap-2.5">
        
        <button @click="handleSmartControl()"
                :disabled="isScanning || isToggling"
                class="w-full md:w-auto inline-flex items-center justify-center gap-2 px-5 py-2.5 rounded-xl font-bold text-xs sm:text-sm transition shadow-sm min-h-[44px] disabled:opacity-50"
                :class="engineStatus === 'RUNNING'
                        ? 'bg-amber-50 hover:bg-amber-100 text-amber-900 border border-amber-300 shadow-amber-100'
                        : 'bg-indigo-600 hover:bg-indigo-700 text-white shadow-indigo-200'">
            
            <!-- Loading Spinner saat scanning / toggling -->
            <svg x-show="isScanning || isToggling" class="animate-spin -ml-1 mr-1 h-4 w-4" fill="none" viewBox="0 0 24 24">
                <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
            </svg>

            <!-- Mode 1: Saat STOPPED -> Tampilkan Tombol Mulai & Cek Sekarang -->
            <template x-if="!isScanning && !isToggling && engineStatus !== 'RUNNING'">
                <div class="flex items-center gap-2">
                    <svg class="w-4 h-4 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14.752 11.168l-3.197-2.132A1 1 0 0010 9.87v4.263a1 1 0 001.555.832l3.197-2.132a1 1 0 000-1.664z"/>
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/>
                    </svg>
                    <span>Mulai Pemantauan &amp; Cek Sekarang</span>
                </div>
            </template>

            <!-- Mode 2: Saat RUNNING -> Tampilkan Tombol Jeda Pemantauan -->
            <template x-if="!isScanning && !isToggling && engineStatus === 'RUNNING'">
                <div class="flex items-center gap-2">
                    <svg class="w-4 h-4 text-amber-700" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 9v6m4-6v6m7-3a9 9 0 11-18 0 9 9 0 0118 0z"/>
                    </svg>
                    <span>Jeda Pemantauan</span>
                </div>
            </template>

            <!-- Teks saat sedang proses -->
            <span x-show="isScanning">Memindai ONT Jaringan...</span>
            <span x-show="isToggling && !isScanning">Menyimpan status...</span>
        </button>

    </div>

</div>
