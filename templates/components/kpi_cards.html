<!-- 4 Kartu KPI Ringkasan Kesehatan Jaringan ONT (Neutral Apple HIG with Alert Highlights) -->
<div class="grid grid-cols-2 lg:grid-cols-4 gap-3 sm:gap-4 mb-6" id="dashboardKpiGrid">
    
    <!-- 1. Total ONT (Neutral Monochromatic) -->
    <div class="kpi-metric-card" id="kpiCardTotal">
        <div class="kpi-metric-header">
            <span class="kpi-metric-title">Total Terpantau</span>
            <div class="kpi-metric-icon bg-slate-100 text-slate-700 shadow-2xs">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 3v2m6-2v2M9 19v2m6-2v2M5 9H3m2 6H3m18-6h-2m2 6h-2M7 19h10a2 2 0 002-2V7a2 2 0 00-2-2H7a2 2 0 00-2 2v10a2 2 0 002 2zM9 9h6v6H9V9z"/></svg>
            </div>
        </div>
        <div class="kpi-metric-value-row">
            <span class="kpi-metric-number text-slate-900" x-text="kpi.total_monitored">111</span>
            <span class="kpi-metric-unit">Modem</span>
            <span x-show="kpi.monitored_inactive > 0" class="text-xs font-bold text-slate-500" :title="kpi.monitored_inactive + ' pelanggan dinonaktifkan (OFF)'">
                (<span x-text="kpi.monitored_inactive"></span> OFF)
            </span>
        </div>
        <div class="kpi-metric-caption">
            Dipantau aktif di database
        </div>
    </div>

    <!-- 2. Sinyal Normal (Clean Slate Neutral) -->
    <div class="kpi-metric-card" id="kpiCardNormal">
        <div class="kpi-metric-header">
            <span class="kpi-metric-title">Sinyal Normal</span>
            <div class="kpi-metric-icon bg-slate-100 text-slate-700 shadow-2xs">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>
            </div>
        </div>
        <div class="kpi-metric-value-row">
            <span class="kpi-metric-number text-slate-900" x-text="kpi.normal">0</span>
            <span class="kpi-metric-unit text-slate-500 font-semibold">&gt; -26 dBm</span>
        </div>
        <div class="kpi-metric-caption">
            Kualitas optik prima
        </div>
    </div>

    <!-- 3. Warning Peringatan Awal (<= -26 dBm) -->
    <div class="kpi-metric-card bg-amber-50/40 border-amber-200/70" id="kpiCardWarning">
        <div class="kpi-metric-header">
            <span class="kpi-metric-title text-amber-900">Warning Redaman</span>
            <div class="kpi-metric-icon bg-amber-100 text-amber-700 shadow-xs">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"/></svg>
            </div>
        </div>
        <div class="kpi-metric-value-row">
            <span class="kpi-metric-number text-amber-600" x-text="kpi.warning">0</span>
            <span class="kpi-metric-unit text-amber-800 font-bold">&le; -26.0 dBm</span>
        </div>
        <div class="kpi-metric-caption text-amber-800">
            Indikasi drop / tekukan
        </div>
    </div>

    <!-- 4. LOS / Modem Mati -->
    <div class="kpi-metric-card bg-rose-50/40 border-rose-200/70" id="kpiCardLos">
        <div class="kpi-metric-header">
            <span class="kpi-metric-title text-rose-900">LOS / Mati</span>
            <div class="kpi-metric-icon bg-rose-100 text-rose-700 shadow-xs">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M18.364 5.636a9 9 0 010 12.728m0 0l-2.829-2.829m2.829 2.829L21 21M15.536 8.464a5 5 0 010 7.072m0 0l-2.829-2.829m-4.243 4.243a9 9 0 01-2.828-5.657m0 0l2.828 2.828M3 3l18 18"/></svg>
            </div>
        </div>
        <div class="kpi-metric-value-row">
            <span class="kpi-metric-number text-rose-600" x-text="kpi.los + kpi.critical">0</span>
            <span class="kpi-metric-unit text-rose-700 font-bold">Offline</span>
        </div>
        <div class="kpi-metric-caption text-rose-700">
            Putus sinyal / daya mati
        </div>
    </div>

</div>
