<!-- Visualisasi Grafik Riwayat Redaman (Tabler Telemetry Chart) -->
<div class="card mb-5" id="dashboardRedamanChartSection">
    <div class="card-status-top card-status-azure"></div>
    
    <div class="flex flex-col lg:flex-row items-start lg:items-center justify-between gap-3.5 mb-3.5 pt-1">
        <div>
            <div class="flex flex-wrap items-center gap-2">
                <h3 class="text-sm font-extrabold text-slate-900 uppercase tracking-wider flex items-center gap-2">
                    <!-- Tabler Icon: Chart Line -->
                    <svg class="w-4 h-4 text-[#0808dd]" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24">
                        <path d="M4 19l16 0"/>
                        <path d="M4 15l4 -6l4 2l4 -5l4 4"/>
                    </svg>
                    Tren Riwayat Kualitas Redaman (dBm)
                </h3>
                <span class="inline-flex items-center px-2 py-0.5 rounded text-[10px] font-bold bg-amber-50 text-amber-700 border border-amber-200">
                    Batas Peringatan: -26.0 dBm
                </span>
            </div>
            <p class="text-xs text-slate-500 mt-0.5">Pemantauan kurva fluktuasi sinyal optik rata-rata jaringan ISP dari tabel database</p>
        </div>

        <!-- Filter Tanggal & Rentang Waktu (Tabler Segmented Control) -->
        <div class="flex flex-wrap items-center gap-2 w-full lg:w-auto">
            <!-- Date Picker -->
            <div class="relative flex-1 sm:flex-none">
                <input type="date"
                       x-model="selectedDate"
                       :min="minDate"
                       :max="todayDate"
                       @change="onDateSelect()"
                       title="Pilih tanggal spesifik untuk melihat tren grafik"
                       class="px-2.5 py-1.5 text-xs bg-slate-50 hover:bg-slate-100 focus:bg-white text-slate-800 border border-slate-200 rounded-md focus:outline-none focus:ring-2 focus:ring-[#0808dd]/20 min-h-[34px] font-semibold transition cursor-pointer">
            </div>

            <!-- Segmented Control -->
            <div class="apple-segmented-control flex-1 sm:flex-none bg-slate-100 border-slate-200">
                <button @click="switchChartRange('today')"
                        :class="chartRange === 'today' ? 'active !bg-white !text-[#0808dd] shadow-xs' : 'text-slate-600'"
                        class="apple-segmented-btn flex-1 sm:flex-none font-bold">
                    Hari Ini
                </button>
                <button @click="switchChartRange('yesterday')"
                        :class="chartRange === 'yesterday' ? 'active !bg-white !text-[#0808dd] shadow-xs' : 'text-slate-600'"
                        class="apple-segmented-btn flex-1 sm:flex-none font-bold">
                    Kemarin
                </button>
                <button @click="switchChartRange('week')"
                        :class="chartRange === 'week' ? 'active !bg-white !text-[#0808dd] shadow-xs' : 'text-slate-600'"
                        class="apple-segmented-btn flex-1 sm:flex-none font-bold">
                    7 Hari
                </button>
            </div>
        </div>
    </div>

    <!-- Data Summary Chips (Tabler Modular Chips) -->
    <div class="grid grid-cols-2 sm:grid-cols-4 gap-2 mb-3.5 p-2.5 bg-slate-50 rounded-xl border border-slate-100 text-xs text-slate-700">
        <div class="flex items-center gap-2">
            <div class="p-1.5 rounded-lg bg-indigo-50 text-[#0808dd] shrink-0">
                <!-- Tabler Icon: Trending Up -->
                <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24">
                    <path d="M3 17l6 -6l4 4l8 -8"/>
                    <path d="M14 7l7 0l0 7"/>
                </svg>
            </div>
            <div>
                <span class="text-[10px] text-slate-400 font-bold uppercase tracking-wider block">Rata-rata:</span>
                <span class="font-extrabold text-slate-800" x-text="chartStats.avg_dbm !== null ? chartStats.avg_dbm + ' dBm' : '-'"></span>
            </div>
        </div>

        <div class="flex items-center gap-2">
            <div class="p-1.5 rounded-lg bg-emerald-50 text-emerald-600 shrink-0">
                <!-- Tabler Icon: Circle Arrow Up (Terbaik) -->
                <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24">
                    <path d="M12 12m-9 0a9 9 0 1 0 18 0a9 9 0 1 0 -18 0"/>
                    <path d="M12 8l-4 4"/>
                    <path d="M12 8l4 4"/>
                    <path d="M12 8l0 8"/>
                </svg>
            </div>
            <div>
                <span class="text-[10px] text-slate-400 font-bold uppercase tracking-wider block">Terbaik:</span>
                <span class="font-extrabold text-emerald-600" x-text="chartStats.min_dbm !== null ? chartStats.min_dbm + ' dBm' : '-'"></span>
            </div>
        </div>

        <div class="flex items-center gap-2">
            <div class="p-1.5 rounded-lg bg-rose-50 text-rose-600 shrink-0">
                <!-- Tabler Icon: Circle Arrow Down (Terendah) -->
                <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24">
                    <path d="M12 12m-9 0a9 9 0 1 0 18 0a9 9 0 1 0 -18 0"/>
                    <path d="M8 12l4 4"/>
                    <path d="M16 12l-4 4"/>
                    <path d="M12 8l0 8"/>
                </svg>
            </div>
            <div>
                <span class="text-[10px] text-slate-400 font-bold uppercase tracking-wider block">Terendah:</span>
                <span class="font-extrabold text-rose-600" x-text="chartStats.max_dbm !== null ? chartStats.max_dbm + ' dBm' : '-'"></span>
            </div>
        </div>

        <div class="flex items-center gap-2">
            <div class="p-1.5 rounded-lg bg-slate-100 text-slate-600 shrink-0">
                <!-- Tabler Icon: Chart Bar / Sample Points -->
                <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24">
                    <path d="M3 12m0 1a1 1 0 0 1 1 -1h4a1 1 0 0 1 1 1v6a1 1 0 0 1 -1 1h-4a1 1 0 0 1 -1 -1z"/>
                    <path d="M9 8m0 1a1 1 0 0 1 1 -1h4a1 1 0 0 1 1 1v10a1 1 0 0 1 -1 1h-4a1 1 0 0 1 -1 -1z"/>
                    <path d="M15 4m0 1a1 1 0 0 1 1 -1h4a1 1 0 0 1 1 1v14a1 1 0 0 1 -1 1h-4a1 1 0 0 1 -1 -1z"/>
                    <path d="M4 20l14 0"/>
                </svg>
            </div>
            <div>
                <span class="text-[10px] text-slate-400 font-bold uppercase tracking-wider block">Total Sampel:</span>
                <span class="font-extrabold text-slate-800" x-text="chartStats.total_points + ' Scan'"></span>
            </div>
        </div>
    </div>

    <!-- Chart Canvas Container -->
    <div class="relative w-full h-[250px] sm:h-[290px] overflow-hidden" id="chart-canvas-container">
        <!-- Interactive Zoom Controls (Khusus Mobile: sm:hidden) -->
        <div class="sm:hidden absolute top-2 right-2 z-10 flex items-center gap-1 bg-white/95 backdrop-blur-md p-1 rounded-md border border-slate-200 shadow-xs select-none">
            <button @click="zoomInChart()"
                    type="button"
                    class="w-6 h-6 rounded bg-slate-100 hover:bg-indigo-50 hover:text-[#0808dd] text-slate-700 font-bold flex items-center justify-center transition active:scale-90"
                    title="Perbesar Grafik">
                <!-- Tabler Icon: Zoom In -->
                <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24">
                    <path d="M10 10m-7 0a7 7 0 1 0 14 0a7 7 0 1 0 -14 0"/>
                    <path d="M7 10l6 0"/>
                    <path d="M10 7l0 6"/>
                    <path d="M21 21l-6 -6"/>
                </svg>
            </button>
            <button @click="zoomOutChart()"
                    type="button"
                    class="w-6 h-6 rounded bg-slate-100 hover:bg-indigo-50 hover:text-[#0808dd] text-slate-700 font-bold flex items-center justify-center transition active:scale-90"
                    title="Perkecil Grafik">
                <!-- Tabler Icon: Zoom Out -->
                <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24">
                    <path d="M10 10m-7 0a7 7 0 1 0 14 0a7 7 0 1 0 -14 0"/>
                    <path d="M7 10l6 0"/>
                    <path d="M21 21l-6 -6"/>
                </svg>
            </button>
            <button @click="resetZoomChart()"
                    type="button"
                    class="px-1.5 h-6 rounded bg-slate-100 hover:bg-slate-200 text-slate-700 text-[10px] font-extrabold flex items-center justify-center gap-1 transition active:scale-90"
                    title="Kembalikan Tampilan Awal">
                <!-- Tabler Icon: Rotate -->
                <svg class="w-3 h-3 text-slate-500" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24">
                    <path d="M19.95 11a8 8 0 1 0 -.5 4m.5 5v-5h-5"/>
                </svg>
                <span>Reset</span>
            </button>
        </div>

        <canvas id="redamanChart" class="transition-transform duration-200 ease-out origin-center"></canvas>
    </div>

    <div class="mt-3 pt-3 border-t border-slate-100 flex flex-wrap items-center justify-between gap-2 text-[11px] text-slate-500">
        <div class="flex flex-wrap items-center gap-3">
            <template x-for="(ds, idx) in activeDatasets.filter(d => !d.isThreshold)" :key="idx">
                <div class="flex items-center gap-1.5 cursor-pointer hover:opacity-80 transition select-none"
                     @click="toggleDatasetVisibility(ds.index)"
                     :title="'Klik untuk menampilkan/menyembunyikan garis ' + ds.label">
                    <span class="h-2.5 w-2.5 rounded-full inline-block flex-shrink-0" :style="'background-color: ' + ds.color"></span>
                    <span class="font-bold text-slate-700" :class="ds.hidden ? 'line-through opacity-40' : ''" x-text="ds.label"></span>
                </div>
            </template>

            <div class="flex items-center gap-1.5 ml-1 pl-2 border-l border-slate-200">
                <span class="h-0.5 w-3 bg-amber-400 inline-block"></span>
                <span class="text-amber-700 font-bold">Garis Warning (-26.0 dBm)</span>
            </div>
            <div class="flex items-center gap-1.5">
                <span class="h-0.5 w-3 bg-rose-400 inline-block"></span>
                <span class="text-rose-700 font-bold">Garis Kritis (-27.0 dBm)</span>
            </div>
        </div>
        <div>
            Nilai optimal: <span class="font-extrabold text-emerald-600">-12 s/d -25.9 dBm</span>
        </div>
    </div>

</div>
