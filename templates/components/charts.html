<!-- Visualisasi Grafik Riwayat Redaman (Chart.js) -->
<div class="bg-white rounded-2xl p-4 sm:p-5 border border-slate-200 shadow-sm mb-6">
    
    <div class="flex flex-col sm:flex-row items-start sm:items-center justify-between gap-3 mb-4">
        <div>
            <div class="flex items-center gap-2">
                <h3 class="text-sm font-bold text-slate-900 uppercase tracking-wider">Tren Riwayat Kualitas Redaman (dBm)</h3>
                <span class="inline-flex items-center px-2 py-0.5 rounded text-[10px] font-bold bg-amber-50 text-amber-800 border border-amber-200">
                    Batas Peringatan: -26.0 dBm
                </span>
            </div>
            <p class="text-xs text-slate-500 mt-0.5">Memantau fluktuasi sinyal optik rata-rata jaringan ISP dari tabel log TiDB</p>
        </div>

        <!-- Rentang Waktu (Tabs) -->
        <div class="inline-flex rounded-xl bg-slate-100 p-1 border border-slate-200 self-stretch sm:self-auto">
            <button @click="switchChartRange('today')"
                    :class="chartRange === 'today' ? 'bg-white text-indigo-600 shadow-sm font-bold' : 'text-slate-600 hover:text-slate-900 font-medium'"
                    class="px-3 py-1.5 rounded-lg text-xs transition flex-1 sm:flex-none">
                Hari Ini
            </button>
            <button @click="switchChartRange('week')"
                    :class="chartRange === 'week' ? 'bg-white text-indigo-600 shadow-sm font-bold' : 'text-slate-600 hover:text-slate-900 font-medium'"
                    class="px-3 py-1.5 rounded-lg text-xs transition flex-1 sm:flex-none">
                7 Hari
            </button>
            <button @click="switchChartRange('month')"
                    :class="chartRange === 'month' ? 'bg-white text-indigo-600 shadow-sm font-bold' : 'text-slate-600 hover:text-slate-900 font-medium'"
                    class="px-3 py-1.5 rounded-lg text-xs transition flex-1 sm:flex-none">
                30 Hari
            </button>
        </div>
    </div>

    <!-- Chart Canvas Container -->
    <div class="relative w-full h-[240px] sm:h-[280px]">
        <canvas id="redamanChart"></canvas>
    </div>

    <div class="mt-3 pt-3 border-t border-slate-100 flex flex-wrap items-center justify-between gap-2 text-[11px] text-slate-500">
        <div class="flex items-center gap-4">
            <div class="flex items-center gap-1.5">
                <span class="h-2.5 w-2.5 rounded-full bg-indigo-500 inline-block"></span>
                <span>Nilai Redaman Rata-rata</span>
            </div>
            <div class="flex items-center gap-1.5">
                <span class="h-0.5 w-3 bg-amber-500 inline-block"></span>
                <span class="text-amber-700 font-semibold">Garis Warning (-26.0 dBm)</span>
            </div>
        </div>
        <div>
            Nilai optimal: <span class="font-bold text-emerald-600">-12 s/d -25.9 dBm</span>
        </div>
    </div>

</div>
