# EdTeknoGuard - Docker Compose (Live Sync & Hot Reload)
# Terhubung ke TiDB Cloud & Domain Ngrok: https://duty-astride-outright.ngrok-free.dev
services:
  edteknoguard:
    build:
      context: .
      dockerfile: Dockerfile
    image: edteknoguard:latest
    container_name: edteknoguard
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - APP_URL=${APP_URL:-https://duty-astride-outright.ngrok-free.dev}
      - TZ=Asia/Jakarta
      - PYTHONUNBUFFERED=1
    ports:
      - "8000:8000"   # Akses jaringan lokal / host
    volumes:
      - ./data:/app/data                           # Persistensi scan_state.json & runtime data
      - ./app:/app/app                             # Live sync otomatis kode backend
      - ./templates:/app/templates                 # Live sync otomatis template HTML Jinja2
      - ./static:/app/static                       # Live sync otomatis aset CSS & JS
      - ./portal_pelanggan:/app/portal_pelanggan   # Live sync otomatis modul & template portal warga
    develop:
      watch:
        - action: sync
          path: ./app
          target: /app/app
        - action: sync
          path: ./templates
          target: /app/templates
        - action: sync
          path: ./static
          target: /app/static
        - action: sync
          path: ./portal_pelanggan
          target: /app/portal_pelanggan
        - action: rebuild
          path: ./requirements.txt
    command: [
      "uvicorn", "app.main:app",
      "--host", "0.0.0.0",
      "--port", "8000",
      "--reload",
      "--reload-dir", "/app/app",
      "--reload-dir", "/app/templates",
      "--reload-dir", "/app/portal_pelanggan",
      "--proxy-headers",
      "--forwarded-allow-ips=*"
    ]

  ngrok:
    image: ngrok/ngrok:latest
    container_name: ngrok-edtekno
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - NGROK_AUTHTOKEN=${NGROK_AUTHTOKEN}
    command:
      - "http"
      - "edteknoguard:8000"
      - "--url=duty-astride-outright.ngrok-free.dev"
      - "--log=stdout"
    depends_on:
      - edteknoguard