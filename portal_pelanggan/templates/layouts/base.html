<!DOCTYPE html>
<html lang="id" class="h-full bg-[#f4f6fa] text-slate-800 antialiased">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0">
    <title>{% block title %}TeknoCust: Layanan Pelanggan ISP{% endblock %}</title>

    <!-- Tabler Typography (Plus Jakarta Sans) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">

    <!-- Tailwind CSS (CDN) -->
    <script>
        (function() {
            const origWarn = console.warn;
            console.warn = function(...args) {
                if (args[0] && typeof args[0] === 'string' && args[0].includes('cdn.tailwindcss.com should not be used in production')) return;
                origWarn.apply(console, args);
            };
        })();
    </script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        tblr: {
                            blue: '#206bc4',
                            'blue-hover': '#17549c',
                            'blue-lt': '#e9f1fa',
                            green: '#2fb344',
                            'green-lt': '#eaf7ec',
                            yellow: '#f59f00',
                            'yellow-lt': '#fef5e6',
                            red: '#d63939',
                            'red-lt': '#fbebeb',
                            slate: '#626976',
                            canvas: '#f4f6fa',
                            border: '#e6e8eb'
                        },
                        primary: {
                            50: '#eef6ff',
                            100: '#e0f0fe',
                            500: '#206bc4',
                            600: '#1d5eb0',
                            700: '#17549c',
                            800: '#14437a',
                            900: '#0f335c',
                        }
                    },
                    fontFamily: {
                        sans: ['"Plus Jakarta Sans"', '-apple-system', 'BlinkMacSystemFont', 'system-ui', 'sans-serif'],
                        mono: ['"SF Mono"', 'Menlo', 'Monaco', 'Consolas', 'monospace']
                    }
                }
            }
        }
    </script>

    <!-- Tabler Design System Master CSS for Portal -->
    <link rel="stylesheet" href="/portal/static/css/portal.css?v=3.1">

    <!-- Alpine.js (CDN) -->
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
    {% block head %}{% endblock %}
</head>

<body class="min-h-full bg-[#f4f6fa] flex flex-col items-center antialiased">

    <!-- Mobile Frame Container (Max-w-md on desktop, 100% full-width on mobile) -->
    <div class="w-full max-w-md min-h-screen bg-[#f4f6fa] flex flex-col shadow-lg relative pb-24 border-x border-[#e6e8eb]">
        
        <!-- Top App Bar Header (Tabler Clean White Header) -->
        <header class="sticky top-0 z-30 bg-white border-b border-[#e6e8eb] px-4 py-3 flex items-center justify-between shadow-2xs">
            <div class="flex items-center gap-2.5">
                <div class="w-9 h-9 rounded-lg bg-[#206bc4] flex items-center justify-center text-white shadow-xs">
                    <!-- Tabler Icon: Shield Check -->
                    <svg class="w-5 h-5 text-white" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24">
                        <path d="M12 3a12 12 0 0 0 8.5 3a12 12 0 0 1 -8.5 15a12 12 0 0 1 -8.5 -15a12 12 0 0 0 8.5 -3"/>
                        <path d="M9 12l2 2l4 -4"/>
                    </svg>
                </div>
                <div>
                    <h1 class="text-base font-black text-slate-900 tracking-tight leading-tight">
                        Tekno<span class="text-[#206bc4]">Cust</span>
                    </h1>
                    <p class="text-[11px] text-slate-400 font-medium">Layanan Internet &amp; Jaringan Warga</p>
                </div>
            </div>

            {% if current_cust %}
            <a href="{{ base_url or '' }}/logout" 
               class="p-2 rounded-lg text-slate-400 hover:text-rose-600 hover:bg-rose-50 transition min-h-[40px] min-w-[40px] flex items-center justify-center" 
               title="Keluar (Logout)">
                <!-- Tabler Icon: Logout -->
                <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24">
                    <path d="M14 8v-2a2 2 0 0 0 -2 -2h-7a2 2 0 0 0 -2 2v12a2 2 0 0 0 2 2h7a2 2 0 0 0 2 -2v-2"/>
                    <path d="M9 12h12l-3 -3"/>
                    <path d="M18 15l3 -3"/>
                </svg>
            </a>
            {% endif %}
        </header>

        <!-- Main Content View -->
        <main class="flex-1 p-4 space-y-4">
            {% block content %}{% endblock %}
        </main>

        {% if current_cust %}
        <!-- Sticky Bottom Navigation Bar (Tabler 5 Tab Dock) -->
        <nav class="fixed bottom-0 w-full max-w-md bg-white border-t border-[#e6e8eb] z-40 flex items-center justify-around py-1.5 px-1 shadow-[0_-2px_10px_rgba(0,0,0,0.05)] pb-[calc(env(safe-area-inset-bottom)+0.4rem)]">
            
            <!-- Tab 1: Beranda -->
            <a href="{{ base_url or '' }}/"
               class="flex flex-col items-center justify-center py-1 flex-1 min-h-[48px] rounded-lg transition text-decoration-none {% if active_tab == 'dashboard' %}text-[#206bc4] font-black bg-[#e9f1fa]{% else %}text-slate-500 hover:text-slate-900 font-bold{% endif %}">
                <!-- Tabler Icon: Home -->
                <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24">
                    <path d="M5 12l-2 0l9 -9l9 9l-2 0"/>
                    <path d="M5 12v7a2 2 0 0 0 2 2h10a2 2 0 0 0 2 -2v-7"/>
                    <path d="M9 21v-6a2 2 0 0 1 2 -2h2a2 2 0 0 1 2 2v6"/>
                </svg>
                <span class="text-[11px] mt-0.5 font-extrabold tracking-tight">Beranda</span>
            </a>

            <!-- Tab 2: Lapor Kendala -->
            <a href="{{ base_url or '' }}/kendala"
               class="flex flex-col items-center justify-center py-1 flex-1 min-h-[48px] rounded-lg transition text-decoration-none {% if active_tab == 'kendala' %}text-[#206bc4] font-black bg-[#e9f1fa]{% else %}text-slate-500 hover:text-slate-900 font-bold{% endif %}">
                <!-- Tabler Icon: Alert Triangle / Ticket -->
                <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24">
                    <path d="M12 9v4"/>
                    <path d="M12 16v.01"/>
                    <path d="M5 19h14a2 2 0 0 0 1.84 -2.75l-7.1 -12.25a2 2 0 0 0 -3.5 0l-7.1 12.25a2 2 0 0 0 1.75 2.75"/>
                </svg>
                <span class="text-[11px] mt-0.5 font-extrabold tracking-tight">Kendala</span>
            </a>

            <!-- Tab 3: Kelola WiFi -->
            <a href="{{ base_url or '' }}/wifi"
               class="flex flex-col items-center justify-center py-1 flex-1 min-h-[48px] rounded-lg transition text-decoration-none {% if active_tab == 'wifi' %}text-[#206bc4] font-black bg-[#e9f1fa]{% else %}text-slate-500 hover:text-slate-900 font-bold{% endif %}">
                <!-- Tabler Icon: Wifi -->
                <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24">
                    <path d="M12 18l.01 0"/>
                    <path d="M9.172 15.172a4 4 0 0 1 5.656 0"/>
                    <path d="M6.343 12.343a8 8 0 0 1 11.314 0"/>
                    <path d="M3.515 9.515c4.686 -4.687 12.284 -4.687 17 0"/>
                </svg>
                <span class="text-[11px] mt-0.5 font-extrabold tracking-tight">WiFi</span>
            </a>

            <!-- Tab 4: Kuota -->
            <a href="{{ base_url or '' }}/kuota"
               class="flex flex-col items-center justify-center py-1 flex-1 min-h-[48px] rounded-lg transition text-decoration-none {% if active_tab == 'kuota' %}text-[#206bc4] font-black bg-[#e9f1fa]{% else %}text-slate-500 hover:text-slate-900 font-bold{% endif %}">
                <!-- Tabler Icon: Database -->
                <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24">
                    <path d="M12 6m-8 0a8 3 0 1 0 16 0a8 3 0 1 0 -16 0"/>
                    <path d="M4 6v6a8 3 0 0 0 16 0v-6"/>
                    <path d="M4 12v6a8 3 0 0 0 16 0v-6"/>
                </svg>
                <span class="text-[11px] mt-0.5 font-extrabold tracking-tight">Kuota</span>
            </a>

            <!-- Tab 5: Profil -->
            <a href="{{ base_url or '' }}/profil"
               class="flex flex-col items-center justify-center py-1 flex-1 min-h-[48px] rounded-lg transition text-decoration-none {% if active_tab == 'profil' %}text-[#206bc4] font-black bg-[#e9f1fa]{% else %}text-slate-500 hover:text-slate-900 font-bold{% endif %}">
                <!-- Tabler Icon: User -->
                <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24">
                    <path d="M8 7a4 4 0 1 0 8 0a4 4 0 0 0 -8 0"/>
                    <path d="M6 21v-2a4 4 0 0 1 4 -4h4a4 4 0 0 1 4 4v2"/>
                </svg>
                <span class="text-[11px] mt-0.5 font-extrabold tracking-tight">Profil</span>
            </a>

        </nav>
        {% endif %}

    </div>

    {% block scripts %}{% endblock %}
</body>
</html>
